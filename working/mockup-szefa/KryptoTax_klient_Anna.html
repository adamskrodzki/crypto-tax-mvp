 const fresh=initial(), old=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};

 out.payment.overages=Array.isArray(out.payment.overages)?out.payment.overages.filter(p=>p&&typeof p==='object'&&Number.isFinite(Number(p.amount))&&Number(p.amount)>=0&&Number.isFinite(Number(p.units))&&Number(p.units)>0):[];

 }
 if(!Array.isArray(out.payment.upgrades))out.payment.upgrades=[];if(!Array.isArray(out.payment.overages))out.payment.overages=[];

function connectedExchanges(){const ids=new Set(S.demoLoaded?['binance','coinbase']:[]);if(S.kraken)ids.add('kraken');S.extraSources.forEach(x=>ids.add(x.id));return exchanges.filter(x=>ids.has(x.id))}

function allTransactions(){
 const rows=[],y=S.taxYear;
 const add=(source,kind,count,seed=0)=>{for(let i=0;i<count;i++){const month=String(1+(i+seed)%12).padStart(2,'0'),day=String(1+(i*7+seed)%27).padStart(2,'0');const amount=Math.round((5+(i*17+seed)%490)*100)/100;rows.push({id:`${source}-${kind}-${i}`,date:`${y}-${month}-${day}`,source,kind,amount:kind==='Sprzedaż'?amount:-amount,status:'Rozpoznana',desc:kind==='Płatność kartą'?['Zakupy kartą Coinbase','Subskrypcja · karta Coinbase','Płatność internetowa kartą'][i%3]:`${kind} · ${['BTC','ETH','USDC'][i%3]}`})}};
 for(const x of connectedExchanges()){if(x.id==='coinbase'){add(x.name,'Płatność kartą',200,2);add(x.name,'Kupno',22,4);add(x.name,'Sprzedaż',20,6)}else if(x.id==='binance'){add(x.name,'Kupno',83,1);add(x.name,'Sprzedaż',50,3);add(x.name,'Transfer',20,5)}else{add(x.name,'Kupno',12,2);add(x.name,'Sprzedaż',8,1);add(x.name,'Transfer',4,7)}}
 if(S.demoLoaded)add('Revolut','Przelew bankowy',26,5);
 if(S.csv)add('CSV','Import CSV',12,9);
 if(hasOperations()){rows.push({id:'cash',date:`${y}-06-10`,source:'Kantor',kind:'Wypłata gotówki',amount:8400,status:S.cashDone?'Zweryfikowana':'Do wyjaśnienia',desc:'Wypłata w kantorze'},{id:'bank',date:`${y}-08-21`,source:'Bank',kind:'Przelew do osoby trzeciej',amount:-12600,status:S.bankDone?'Zweryfikowana':'Do wyjaśnienia',desc:'Przelew na inny rachunek'})}
 return rows;
}
const operationCount=()=>allTransactions().length;
let totalPaid=()=>Math.round((Math.max(0,Number(S.payment.amount)||0)+(S.payment.upgrades||[]).reduce((sum,p)=>sum+Math.max(0,Number(p.amount)||0),0))*100)/100;
function upgradeOffer(){
 const current=selectedPlan(),count=operationCount();
 if(!current||!S.payment.paid)return null;
 const exceeded=count>current.limit;
 const target=exceeded?(plans.find(p=>count<=p.limit)||plans.at(-1)):current;
 const price=target.id==='custom'?(current.id==='custom'?Number(S.quote)||0:Number(S.upgradeQuote)||0):target.price;
 const paid=totalPaid(),due=Math.max(0,Math.round((price-paid)*100)/100);
 return {current,target,count,exceeded,price,paid,due,needsQuote:target.id==='custom'&&!price,needed:exceeded||!price||due>0};
}
let planSettled=()=>!!S.payment.paid&&!!selectedPlan()&&!upgradeOffer()?.needed;

function yearPage(){return `<div class="year-layout"><section class="card year-card">${cardhead('Wybierz rok rozliczenia')}<p>Jedna sprawa dotyczy jednego roku podatkowego.</p><div class="year-options">${taxYears().slice(0,3).map((y,i)=>`<label class="year-choice ${S.taxYear===y?'selected':''}"><input type="radio" name="taxYear" value="${y}" ${S.taxYear===y?'checked':''}><span><strong>${y}</strong><small>${i?'Wcześniejszy rok':'Ostatni zakończony rok'}</small></span>${i===0?'<span class="year-recommended">Najczęściej wybierany</span>':''}</label>`).join('')}</div><label class="year-other-label" for="taxYearSelect">Inny rok</label><select id="taxYearSelect"><option value="">Wybierz z pełnej listy lat</option>${taxYears().map((y,i)=>`<option value="${y}" ${S.taxYear===y&&i>2?'selected':''}>${y}</option>`).join('')}</select><div class="year-current"><span>Wybrane rozliczenie</span><strong>PIT-38 za ${S.taxYear} rok</strong></div></section><aside class="card year-help"><span class="eyebrow">OD POCZĄTKU DO GOTOWEJ SPRAWY</span><h2>Jeden krok<br>na raz.</h2><p>Wybierzesz plan, uzupełnisz dane i zbierzesz historię transakcji. Potem sprawę przejmie doradca.</p><div class="note">Do każdego kroku możesz wrócić. Zmiana roku zachowa materiały, ale wycofa wcześniejsze zatwierdzenia, aby doradca mógł sprawdzić ich zgodność z nowym rokiem.</div></aside></div>`}
function planPage(){const p=selectedPlan();return `${billingNeedsAction()?billingCard('plan'):''}<div class="plan-grid">${plans.map(plan=>`<label class="plan-card ${S.plan===plan.id?'selected':''}"><input type="radio" name="plan" value="${plan.id}" ${S.plan===plan.id?'checked':''} ${S.payment.paid?'disabled':''}><span class="plan-volume">${plan.id==='custom'?'1000+':plan.limit}</span><span class="plan-unit">${plan.id==='custom'?'transakcji · wycena':'transakcji w cenie'}</span><strong>${plan.id==='custom'?'Wycena indywidualna':money(plan.price)+' zł'}</strong><span class="plan-desc">${plan.desc}</span><span class="plan-overage">${planOverageCopy(plan)}</span><span class="plan-select">${S.plan===plan.id?'Wybrany plan ✓':'Wybierz plan'}</span></label>`).join('')}</div><div class="equal mt20"><section class="card">${cardhead(S.payment.paid?'Płatność zapisana':'Opłać wybrany plan',S.payment.paid?pill('Opłacono · demo','green'):'')}<p>${p?safe(p.name)+' · PIT-38 za '+S.taxYear:'Wybierz jeden z planów powyżej.'}</p>${S.payment.paid?`<div class="payment-receipt"><strong>${money(totalPaid())} zł</strong><div class="line"><span>Płatnik</span><b>${safe(S.payment.payerName)}</b></div><div class="line"><span>Numer płatności</span><b>${safe(S.payment.transactionId)}</b></div></div><p>Płatność jest przypisana do tej sprawy. Po imporcie sprawdzimy limit planu. Po przekroczeniu limitu wybierzesz: overage według stawki albo większy plan z odjęciem wcześniejszych wpłat. Dane i KYC zostają zachowane.</p>${paymentLedger()}`:S.plan==='custom'&&!planPrice()?`<div class="note">Przy ponad 1000 transakcji doradca najpierw ustala cenę. Po wycenie pojawi się możliwość płatności.</div>${button(S.quoteRequested?'Prośba o wycenę zapisana ✓':'Poproś o indywidualną wycenę','request-quote','primary',S.quoteRequested)}`:p?`<form id="paymentForm"><div class="payment-amount">${money(planPrice())} <small>zł</small></div><label class="field-label" for="payerName">Imię i nazwisko posiadacza karty / płatnika</label><input id="payerName" type="text" autocomplete="cc-name" value="${safe(S.payment.payerName)}" required minlength="3" maxlength="120" placeholder="Wpisz dane płatnika"><p>Dane płatnika porównamy z danymi osoby rozliczającej PIT.</p><button class="btn primary mt20" type="submit">Opłać ${money(planPrice())} zł (demo) →</button></form>`:''}</section><section class="card">${cardhead('Co obejmuje plan?')}<ul class="plain-checks"><li>Zebranie danych z giełd i plików</li><li>Uporządkowaną historię operacji</li><li>Weryfikację wyjątków przez doradcę</li><li>Przygotowanie pakietu rozliczenia</li></ul><div class="note">W demonstracji nie pobieramy pieniędzy ani numeru karty. Zapiszemy testowe potwierdzenie płatności z nazwą płatnika.</div></section></div>`}
const personalFields=[['firstNames','Imię / imiona','text'],['lastName','Nazwisko','text'],['birthSurname','Nazwisko rodowe','text'],['pesel','PESEL','text'],['birthDate','Data urodzenia','date'],['birthPlace','Miejsce urodzenia','text'],['father','Imię ojca','text'],['mother','Imię matki','text'],['citizenship','Obywatelstwo','text']];
const documentFields=[['docNumber','Seria i numer dowodu','text'],['issuer','Organ wydający','text'],['issueDate','Data wydania','date'],['expiryDate','Data ważności','date']];
function profileField([key,label,type]){const extra=key==='pesel'?' inputmode="numeric" pattern="[0-9]{11}" maxlength="11" title="PESEL powinien zawierać 11 cyfr"':key==='docNumber'?' maxlength="20"':type==='date'&&key!=='expiryDate'?` max="${new Date().toISOString().slice(0,10)}"`:'';return `<label class="form-field"><span>${label}</span><input type="${type}" data-profile="${key}" id="profile-${key}" value="${safe(S.profile[key])}" required ${extra} ${type==='text'?'maxlength="120"':''}></label>`}
function kycPage(){const i=S.kycStep,stages=['Dane osobowe','Dokument','Sprawdzenie'];return `<div class="kyc-stages" aria-label="Etapy danych tożsamości">${stages.map((name,n)=>`<button type="button" data-action="kyc-stage-${n}" class="${n===i?'active':''}" ${n>i&&!S.kycSubmitted?'disabled':''}><span>${n+1}</span>${name}</button>`).join('')}</div><div class="kyc-layout"><section class="card"><div class="cardhead"><h2>${stages[i]}</h2>${pill(`Etap ${i+1} z 3`)}</div><form id="kycForm" data-stage="${i}">${i===0?`<p>Przepisz dane zgodnie z dowodem osobistym. Wszystkie pola pozostają puste do czasu ich wprowadzenia.</p><div class="form-grid mt20">${personalFields.map(profileField).join('')}<label class="form-field"><span>Płeć</span><select id="profile-sex" data-profile="sex" required><option value="">Wybierz</option>${['Kobieta','Mężczyzna'].map(x=>`<option ${S.profile.sex===x?'selected':''}>${x}</option>`).join('')}</select></label></div>`:i===1?`<p>Wprowadź dane dokumentu i wskaż jego obie strony. W prototypie zapisujemy wyłącznie nazwy plików.</p><div class="form-grid mt20">${documentFields.map(profileField).join('')}</div><div class="document-upload-grid">${[['front','Awers dowodu'],['back','Rewers dowodu']].map(([side,title])=>`<label class="upload-tile"><span class="upload-symbol">▤</span><strong>${title}</strong><span>${safe(S.kycFiles[side]||'Wybierz zdjęcie / PDF')}</span><input type="file" data-kyc-file="${side}" accept="image/*,.pdf"></label>`).join('')}</div>`:`<div class="identity-overview"><div class="line"><span>Osoba rozliczająca</span><b>${safe(clientName())}</b></div><div class="line"><span>Dowód</span><b>${safe(S.profile.docNumber)}</b></div><div class="line"><span>Płatnik</span><b>${safe(S.payment.payerName)}</b></div><div class="line"><span>Powiązanie płatności</span>${pill(payerMatches()?'Nazwy zgodne':'Niezgodność — do sprawdzenia',payerMatches()?'green':'amber')}</div></div><div class="note ${payerMatches()?'':'warn'}">${payerMatches()?'Zgodność danych płatnika jest jednym z sygnałów do weryfikacji. Doradca osobno potwierdzi tożsamość.':'Płatność pochodzi od osoby o innych danych. Doradca otrzyma zadanie wyjaśnienia powiązania płatnika z klientem.'}</div><label class="checkline"><input type="checkbox" id="kycConfirmed" ${S.kycConfirmed?'checked':''} required><span>Sprawdzono kompletność przepisanych danych i zgodność z dokumentem w tej demonstracji.</span></label>${S.kycSubmitted?`<div class="note ${S.kyc?'good':'warn'}">${S.kyc?'Doradca potwierdził weryfikację w demonstracji.':'Dane przekazane. Możesz dodać źródła, a doradca sprawdzi tożsamość i płatność.'}</div>`:''}`}
 <div class="kyc-actions">${i?button('← Poprzedni etap','kyc-stage-'+(i-1),'secondary'):''}<button type="submit" class="btn primary" ${S.approved?'disabled':''}>${i<2?'Zapisz i dalej →':S.kycSubmitted?'Zapisz zmiany i przekaż ponownie':'Przekaż do weryfikacji (demo) →'}</button></div></form></section><aside class="card kyc-help"><span class="eyebrow">DANE Z DOWODU OSOBISTEGO</span><h2>Spokojnie, po kolei.</h2><p>Najpierw dane osobowe, potem dokument. Przed wysłaniem zobaczysz zestawienie z płatnikiem.</p><div class="note">Postęp zapisuje się na bieżąco. Możesz wrócić do poprzedniego etapu bez utraty wpisanych danych.</div><p>Weryfikacja AML/KYC w tym prototypie jest wykonywana jako ręczna symulacja w panelu doradcy.</p><a class="text-link" href="https://www.gov.pl/web/gov/dowod-osobisty-informacje" target="_blank" rel="noopener">Zakres danych dowodu · gov.pl ↗</a></aside></div>`}
function sourcesPage(){const rows=sourceRows();return `${billingCard('sources')}<div class="source-workspace"><section class="card">${cardhead('Połączone źródła',pill(`${sourceCount()} źródła / importy`))}${rows.length?rows.map(r=>`<div class="source"><span class="sourceIcon">${r.icon}</span><div class="source-copy"><b>${safe(r.name)}</b><small>${safe(r.desc)}</small></div>${pill(r.status,r.color)}</div>`).join(''):`<div class="empty-state compact"><span>⇄</span><h3>Dodaj pierwsze źródło</h3><p>Wybierz giełdę poniżej albo zaimportuj plik z innego miejsca.</p></div>`}${S.sourceImports.map(file=>`<div class="source import-source"><span class="sourceIcon">${file.kind==='CSV'?'▤':'▧'}</span><div class="source-copy"><b>${safe(file.provider||'Inne źródło')} · ${safe(file.kind)}</b><small>${safe(file.name)}</small><small>${file.status==='confirmed'?'Doradca potwierdził demonstracyjny odczyt.':'Sprawdzający otrzymał zadanie potwierdzenia odczytu.'}</small></div>${pill(file.status==='confirmed'?'Potwierdzono':'Do sprawdzenia',file.status==='confirmed'?'green':'amber')}${!S.approved?button('Usuń','remove-import-'+file.id,'small secondary'):''}</div>`).join('')}<div class="buttons mt20">${button('＋ Dodaj nowe źródło','show-source-catalog','secondary')}${button('Historia transakcji →','go-transactions','secondary')}</div></section><section class="card other-import">${cardhead('Inna giełda lub inne źródło')}<p>Nie ma Twojej giełdy na liście? Dodaj CSV albo zdjęcia potwierdzeń.</p><label class="field-label mt16" for="otherSourceName">Nazwa źródła (opcjonalnie)</label><input id="otherSourceName" type="text" maxlength="100" placeholder="Np. nazwa innej giełdy, banku lub kantoru" value="${safe(S.otherSourceName)}"><div class="upload-options"><label class="upload-tile"><span class="upload-symbol">↑</span><strong>Import CSV</strong><span>Historia operacji z dowolnego źródła</span><input type="file" id="sourceCsvInput" accept=".csv,text/csv" multiple></label><label class="upload-tile"><span class="upload-symbol">▧</span><strong>Zdjęcia / skany</strong><span>Potwierdzenia i dokumenty operacji</span><input type="file" id="sourcePhotoInput" accept="image/*,.pdf" multiple></label></div><div class="note">CSV i zdjęcia trafiają do kontroli odczytu. Doradca dostanie powiadomienie w swojej kolejce i potwierdzi lub poprawi rozpoznane dane. W tej wersji odczyt jest symulowany.</div>${importsPending()?pill(`${importsPending()} pliki czekają na potwierdzenie`,'amber'):''}</section></div><section class="card mt20" id="source-catalog">${cardhead('Dodaj kolejną giełdę',pill('Przykładowe integracje'))}<p>Możesz dodać więcej niż jedną giełdę. Połączenie w prototypie wczytuje przykładową historię wybranego źródła.</p><div class="exchange-grid">${exchanges.map(x=>{const added=connectedExchanges().some(e=>e.id===x.id);return `<article class="exchange-card"><span class="exchange-mark" style="--exchange-color:${x.color}">${x.icon}</span><strong>${x.name}</strong><small>${added?'Źródło jest na Twojej liście':'Historia operacji · demonstracja'}</small>${button(added?'Połączono ✓':'＋ Połącz (demo)','connect-'+x.id,added?'small secondary':'small primary',added||S.approved)}</article>`}).join('')}</div></section>`}
function priorPage(){const choices=[['yes','Tak, rozliczano kryptowaluty w poprzednich PIT-38'],['no','Nie składano wcześniejszych PIT-38 z kryptowalutami'],['unknown','Nie pamiętam / nie mam dokumentów']];return `<div class="grid"><section class="card">${cardhead('Czy składano już PIT-38 z kryptowalutami?',pill(priorLabel(),priorReady()?'green':'amber'))}<div class="choice-list">${choices.map(([value,label])=>`<label class="choice"><input type="radio" name="priorChoice" value="${value}" ${S.priorChoice===value?'checked':''} ${S.approved?'disabled':''}><span>${label}</span></label>`).join('')}</div>${S.priorChoice==='unknown'?'<div class="note">Doradca pomoże ustalić brakującą historię. Ta odpowiedź nie zatrzymuje kreatora.</div>':''}${S.priorChoice==='yes'?`<div class="box"><div class="form-grid"><label class="form-field"><span>Rok dokumentu</span><select id="priorYear">${priorYears().map(y=>`<option ${S.priorYear===y?'selected':''}>${y}</option>`).join('')}</select></label><label class="form-field"><span>Rodzaj dokumentu</span><select id="priorDocType">${['PIT-38','Korekta PIT-38','UPO'].map(t=>`<option ${S.priorDocType===t?'selected':''}>${t}</option>`).join('')}</select></label></div><label class="upload-tile inline-upload"><strong>＋ Dodaj dokumenty</strong><span>PDF, XML lub zdjęcie · możesz wybrać kilka</span><input id="priorFileInput" type="file" accept=".pdf,.xml,image/*" multiple ${S.approved?'disabled':''}></label></div>${S.priorDocs.length?S.priorDocs.map((d,i)=>`<div class="docrow"><span class="docicon">▤</span><div class="source-copy"><h3>${safe(d.type)} · ${safe(d.year)}</h3><p>${safe(d.name)}</p>${Number(d.year)>=Number(S.taxYear)?'<small class="prior-year-warning">To nie jest wcześniejszy rok niż wybrane rozliczenie.</small>':''}</div>${button('Usuń','remove-prior-'+i,'small secondary',S.approved)}</div>`).join(''):'<div class="note warn">Dodaj PIT-38 lub jego korektę z wcześniejszego roku. Samo UPO nie zastępuje deklaracji.</div>'}`:''}${S.priorChoice!=='unset'?`<div class="box"><h3>Czy są koszty zakupu krypto sprzed ${S.taxYear} roku, które mogą wymagać uwzględnienia?</h3><div class="choice-list">${[['yes','Tak, ponoszono takie koszty'],['no','Nie, nie było takich kosztów'],['unknown','Nie mam pewności']].map(([value,label])=>`<label class="choice"><input type="radio" name="priorCostChoice" value="${value}" ${S.priorCostChoice===value?'checked':''} ${S.approved?'disabled':''}><span>${label}</span></label>`).join('')}</div>${['yes','unknown'].includes(S.priorCostChoice)?`<label class="field-label" for="priorCostNote">Dodatkowe informacje dla doradcy (opcjonalnie)</label><textarea id="priorCostNote" placeholder="Opisz lata i dostępne informacje o zakupach." ${S.approved?'disabled':''}>${safe(S.priorCostNote)}</textarea>`:''}</div>`:''}</section><aside class="card">${cardhead('Co się wydarzy dalej?')}<ol class="explain-list"><li><strong>Ustalimy historię rozliczeń</strong><p>Twoje odpowiedzi pozwolą sprawdzić wcześniejsze deklaracje.</p></li><li><strong>Doradca sprawdzi koszty</strong><p>Dołączone dokumenty zostaną ocenione przed finalizacją.</p></li><li><strong>Możesz kontynuować</strong><p>Nie musisz czekać na decyzję doradcy, aby przejść do kolejnego kroku.</p></li></ol><div class="note">Zmiana odpowiedzi nie usuwa wcześniej dodanych dokumentów. Przy zmianie deklarowanej historii doradca sprawdzi je ponownie.</div></aside></div>`}
function exceptionsPage(){if(!hasOperations())return `<section class="card empty-state"><span>◇</span><h2>Najpierw dodaj historię operacji</h2><p>Po imporcie danych pokażemy tutaj zdarzenia wymagające wyjaśnienia.</p>${button('Dodaj źródło danych','go-sources','secondary')}</section>`;return `<section class="exception"><div class="exception-top"><div><div class="eyebrow">OPERACJA #01 · 10.06.${S.taxYear}</div><h2>Wypłata 8 400 PLN w kantorze</h2><p>Dołącz potwierdzenie, aby doradca mógł sprawdzić operację.</p></div>${pill(S.cashDone?'Zatwierdzone':S.proof?'Do weryfikacji':'Dodaj dokument',S.cashDone?'green':'amber')}</div><div class="actions">${S.proof?`<span class="filemark">▤ ${safe(S.proofName)}</span>`:''}<label class="btn secondary upload-button">${S.proof?'Zmień dokument':'＋ Dodaj potwierdzenie'}<input id="proofInput" type="file" accept="image/*,.pdf" ${S.approved?'disabled':''}></label></div></section><section class="exception"><div class="exception-top"><div><div class="eyebrow">OPERACJA #02 · 21.08.${S.taxYear}</div><h2>Przelew 12 600 PLN na inny rachunek</h2><p>Wyjaśnij, kto jest właścicielem rachunku i czego dotyczył transfer.</p></div>${pill(S.bankDone?'Zatwierdzone':S.noteSent?'Do weryfikacji':'Do wyjaśnienia',S.bankDone?'green':'amber')}</div>${S.noteSent?`<div class="box"><label>Twoje wyjaśnienie</label><div class="note-text">${safe(S.note)}</div></div><div class="actions">${button('Edytuj odpowiedź','edit-note','secondary small',S.approved)}</div>`:`<label class="field-label mt16" for="noteInput">Opis przelewu</label><textarea id="noteInput" placeholder="Na czyj rachunek trafiły środki i dlaczego?">${safe(S.note)}</textarea><div class="actions">${button('Zapisz wyjaśnienie','send-note')}</div>`}</section><div class="note">Po dodaniu materiałów przejdź do podsumowania. Ich ocena należy do doradcy — nie musisz czekać na nią w tym kroku.</div>`}
function summaryPage(){const ready=clientReady(),rows=[['year','Rok rozliczenia','PIT-38 za '+S.taxYear,S.taxYearConfirmed,'Zmień rok'],['plan','Plan i płatność',S.payment.paid?`${selectedPlan()?.name||'Plan'} · ${money(totalPaid())} zł zapłacono${billingNeedsAction()?' · wymagana dopłata':''}`: 'Wybierz i opłać plan.',planSettled(),billingNeedsAction()?'Rozlicz dopłatę':'Sprawdź plan'],['kyc','Dane tożsamości',S.kycSubmitted?`${clientName()} · ${S.kyc?'zweryfikowano':'oczekuje na kontrolę'}`:'Uzupełnij dane z dowodu i przekaż do weryfikacji.',S.kycSubmitted,'Sprawdź dane'],['sources','Źródła danych',`${sourceCount()} źródła / importy · ${operationCount()} operacji${importsPending()?' · '+importsPending()+' odczyty do sprawdzenia':''}`,sourceCount()>0,'Dodaj źródło'],['prior','Poprzednie PIT-y',priorClientReady()?`${S.priorDocs.length} dokumentów · ${priorLabel().toLowerCase()}`:'Uzupełnij odpowiedzi i wymagane dokumenty.',priorClientReady(),'Edytuj / dodaj'],['exceptions','Wyjaśnienia',!hasOperations()?'Dostępne po imporcie.':explanationsReady()?'Materiały do obu operacji są dostępne.':'Uzupełnij dokument i odpowiedź dla doradcy.',sourceCount()>0&&explanationsReady(),'Uzupełnij']];return `${billingNeedsAction()?billingCard('summary'):''}<div class="summary-layout"><section class="card summary-card">${cardhead('Twoje dane do rozliczenia',pill(`${rows.filter(r=>r[3]).length} / ${rows.length} gotowe`,ready?'green':'amber'))}${rows.map(([page,title,desc,ok,label],i)=>`<div class="summary-row"><span class="summary-check ${ok?'done':''}" aria-label="${ok?'Uzupełnione':'Do uzupełnienia'}">${ok?'✓':i+1}</span><div class="summary-copy"><h3>${title}</h3><p>${safe(desc)}</p></div>${button(label,'go-'+page,'secondary small')}</div>`).join('')}<div class="summary-add-note"><span>↶</span> Przypomniało się coś jeszcze? Wróć do kroku i dołącz dane. Dotychczasowe informacje zostają zapisane.</div></section><aside class="card handoff-card ${billingNeedsAction()?'summary-billing-blocked':''}"><span class="eyebrow">${S.approved?'ZATWIERDZONE':billingNeedsAction()?'NAJPIERW: DOPŁATA':S.clientSubmitted?'SPRAWA U DORADCY':'NASTĘPNIE: TWÓJ DORADCA'}</span><div class="handoff-icon">${S.clientSubmitted?'✓':'↗'}</div><h2>${S.approved?'Pakiet jest zatwierdzony':billingNeedsAction()?'Dopasuj plan do liczby operacji':S.clientSubmitted?'Dane przekazane do sprawdzenia':ready?'Możesz przekazać sprawę':'Jeszcze kilka informacji'}</h2><p>${S.approved?'Doradca zakończył demonstracyjną kontrolę. Dokumenty są dostępne do podglądu.':billingNeedsAction()?'Możesz uzupełniać dane, ale przekazanie i zatwierdzenie sprawy wymaga rozliczenia dopłaty. Dane i KYC pozostają zachowane.':S.clientSubmitted?'Doradca sprawdzi tożsamość, odczyty plików, wcześniejsze deklaracje i wyjątki.':ready?'Dane wejściowe są zebrane. Weryfikacja i zatwierdzenie to kolejne zadania doradcy.':'Uzupełnij pozycje oznaczone na liście. Możesz wracać do dowolnego kroku.'}</p>${button(S.approved?'Zobacz dokumenty':billingNeedsAction()?'Przekazanie czeka na dopłatę':S.clientSubmitted?'Przekazano doradcy ✓':'Przekaż doradcy (demo) →',S.approved?'go-documents':'submit-client','primary',!S.approved&&(!ready||S.clientSubmitted))}<span class="handoff-caption">Przekazanie zapisuje zdarzenie w historii. Dodatkowe materiały możesz dołączać również później.</span>${S.clientSubmitted?button('Zobacz historię sprawy','go-messages','secondary small'):''}</aside></div><details class="result-details"><summary><span><strong>Wstępny wynik podatkowy</strong><small>Wartości demonstracyjne · wymagana kontrola doradcy</small></span><span class="result-peek">${operationCount()?money(caseTotals().tax)+' PLN':'—'} <span>⌄</span></span></summary><div class="result-details-body">${resultDetails()}</div></details>`}
function resultDetails(){if(!operationCount())return '<p class="muted">Wynik pokażemy po dodaniu historii operacji.</p>';return `<div class="hero"><div><div class="tag">${S.approved?'ZATWIERDZONE · DEMO':'WYNIK ROBOCZY · DEMO'}</div><div class="amount mono">${money(caseTotals().tax)} PLN</div><p>PIT-38 za ${S.taxYear}. Kwoty są przykładowymi wartościami dla tej sprawy; prototyp nie wykonuje kalkulacji podatkowej.</p></div>${pill(S.approved?'Zatwierdzone':'Do kontroli',S.approved?'green':'amber')}</div><div class="stats">${stat('Przychody',money(caseTotals().income)+' PLN','Przykładowa wartość')}${stat('Koszty',money(caseTotals().cost)+' PLN','Przykładowa wartość')}${stat('Wynik',money(caseTotals().income-caseTotals().cost)+' PLN','Przykładowa wartość')}</div><div class="note">Historia PIT-38: ${priorLabel()}. Finalna akceptacja wymaga zamknięcia wszystkich zadań doradcy.</div>`}

let T={query:'',source:'all',kind:'all',status:'all',view:'groups',group:'source-kind',sort:'newest',page:1,pageSize:25};
function filteredTransactions(){const query=T.query.trim().toLocaleLowerCase('pl');return allTransactions().filter(x=>(T.source==='all'||x.source===T.source)&&(T.kind==='all'||x.kind===T.kind)&&(T.status==='all'||x.status===T.status)&&(!query||[x.id,x.source,x.kind,x.desc,x.date,money(x.amount)].join(' ').toLocaleLowerCase('pl').includes(query))).sort((a,b)=>T.sort==='amount'?Math.abs(b.amount)-Math.abs(a.amount):T.sort==='oldest'?a.date.localeCompare(b.date):b.date.localeCompare(a.date))}
function filterSelect(id,label,values,current){return `<label class="filter-field"><span>${label}</span><select id="${id}"><option value="all">Wszystkie</option>${values.map(v=>`<option value="${safe(v)}" ${v===current?'selected':''}>${safe(v)}</option>`).join('')}</select></label>`}
function transactionsPage(){const all=allTransactions(),values=key=>[...new Set(all.map(x=>x[key]))].sort((a,b)=>a.localeCompare(b,'pl'));return pageHead('Historia transakcji','Grupuj operacje, zawężaj listę i przeglądaj szczegóły bez przewijania setek pozycji.')+`<div class="stats">${stat('Wszystkie operacje',all.length,'Ze wszystkich dodanych źródeł')}${stat('Płatności kartą',all.filter(x=>x.kind==='Płatność kartą').length,'Grupowane według giełdy i typu')}${stat('Do wyjaśnienia',pending(),'Zadania przypisane do sprawy')}</div><section class="card tx-workspace"><div class="tx-toolbar"><label class="tx-search"><span class="field-label">Szukaj w historii</span><input type="search" id="txSearch" value="${safe(T.query)}" placeholder="Źródło, opis, data lub kwota…"></label><div class="tx-view-switch"><button type="button" data-action="tx-groups" class="${T.view==='groups'?'active':''}" aria-pressed="${T.view==='groups'}">Grupy</button><button type="button" data-action="tx-list" class="${T.view==='list'?'active':''}" aria-pressed="${T.view==='list'}">Lista operacji</button></div></div><div class="tx-filters">${filterSelect('txSource','Źródło',values('source'),T.source)}${filterSelect('txKind','Rodzaj operacji',values('kind'),T.kind)}${filterSelect('txStatus','Status',values('status'),T.status)}<label class="filter-field"><span>Grupuj według</span><select id="txGrouping"><option value="source-kind" ${T.group==='source-kind'?'selected':''}>Źródła i rodzaju</option><option value="source" ${T.group==='source'?'selected':''}>Źródła</option><option value="kind" ${T.group==='kind'?'selected':''}>Rodzaju operacji</option><option value="month" ${T.group==='month'?'selected':''}>Miesiąca</option></select></label><label class="filter-field"><span>Sortowanie operacji</span><select id="txSort">${[['newest','Od najnowszych'],['oldest','Od najstarszych'],['amount','Według wartości']].map(([v,l])=>`<option value="${v}" ${T.sort===v?'selected':''}>${l}</option>`).join('')}</select></label></div><div id="txResults" aria-live="polite">${transactionResults()}</div></section>`}
function transactionResults(){const rows=filteredTransactions(),all=operationCount();let items=rows;
 if(T.view==='groups'){const map=new Map();for(const row of rows){const key=T.group==='source-kind'?row.source+'|'+row.kind:T.group==='month'?row.date.slice(0,7):row[T.group];if(!map.has(key))map.set(key,{key,source:T.group==='source-kind'||T.group==='source'?row.source:'',kind:T.group==='source-kind'||T.group==='kind'?row.kind:'',month:T.group==='month'?row.date.slice(0,7):'',rows:[],amount:0});const group=map.get(key);group.rows.push(row);group.amount+=row.amount}items=[...map.values()].sort((a,b)=>b.rows.length-a.rows.length||a.key.localeCompare(b.key,'pl'))}
 const totalPages=Math.max(1,Math.ceil(items.length/T.pageSize));T.page=Math.max(1,Math.min(T.page,totalPages));const offset=(T.page-1)*T.pageSize,page=items.slice(offset,offset+T.pageSize);
 const resultInfo=`<div class="tx-results-head"><span><strong>${rows.length}</strong> z ${all} operacji${T.view==='groups'?' · '+items.length+' grup':''}</span>${button('Wyczyść filtry','tx-clear','secondary small')}</div>`;
 if(!items.length)return resultInfo+`<div class="empty-state"><span>≡</span><h3>${all?'Brak pasujących operacji':'Historia jest jeszcze pusta'}</h3><p>${all?'Zmień zapytanie lub wyczyść filtry.':'Połącz źródło w kreatorze, aby zobaczyć jego historię.'}</p>${!all?button('Dodaj źródło','go-sources','secondary'):''}</div>`;
 const table=T.view==='groups'?`<div class="table-scroll"><table class="tx-table"><thead><tr><th>Grupa</th><th class="right">Operacje</th><th>Zakres dat</th><th class="right">Suma operacji</th><th></th></tr></thead><tbody>${page.map(group=>{const dates=group.rows.map(x=>x.date).sort();return `<tr><td><strong>${safe(group.source||group.kind||group.month)}</strong><small>${safe(group.source&&group.kind?group.kind:T.group==='month'?'Wszystkie źródła':group.source?'Wszystkie rodzaje':'Wszystkie źródła')}</small></td><td class="right"><span class="group-count">${group.rows.length}</span></td><td class="mono">${dates[0]} — ${dates.at(-1)}</td><td class="right mono">${money(group.amount)} PLN</td><td class="right"><button type="button" class="btn secondary small" data-tx-group="${safe(JSON.stringify({source:group.source,kind:group.kind,month:group.month}))}">Zobacz operacje →</button></td></tr>`}).join('')}</tbody></table></div><p class="table-caption">Suma podpisanych kwot operacji jest informacją pomocniczą, a nie wynikiem podatkowym.</p>`:`<div class="table-scroll"><table class="tx-table"><thead><tr><th>Data</th><th>Źródło</th><th>Rodzaj i opis</th><th class="right">Kwota</th><th>Status</th></tr></thead><tbody>${page.map(row=>`<tr><td class="mono">${row.date}</td><td>${safe(row.source)}</td><td><strong>${safe(row.kind)}</strong><small>${safe(row.desc)}</small></td><td class="right mono">${money(row.amount)} PLN</td><td>${pill(row.status,row.status==='Do wyjaśnienia'?'amber':row.status==='Zweryfikowana'?'green':'purple')}</td></tr>`).join('')}</tbody></table></div>`;
 return resultInfo+table+`<div class="pagination"><span>${offset+1}–${Math.min(offset+T.pageSize,items.length)} z ${items.length} ${T.view==='groups'?'grup':'operacji'}</span><label>Na stronie <select id="txPageSize">${[25,50,100].map(n=>`<option ${n===T.pageSize?'selected':''}>${n}</option>`).join('')}</select></label><div>${button('←','tx-prev','secondary small',T.page===1)}<span>Strona ${T.page} z ${totalPages}</span>${button('→','tx-next','secondary small',T.page===totalPages)}</div></div>`
}
function updateTransactions(){const target=document.getElementById('txResults');if(target)target.innerHTML=transactionResults()}

function problems(){const items=[];
 if(billingNeedsAction())items.push({id:'billing',title:`${operationCount()} operacji / limit ${Number.isFinite(selectedPlan()?.limit)?selectedPlan().limit:'1000+'} — dopłata do planu`,type:'Plan / dopłata',status:upgradeOffer()?.needsQuote?'Do wyceny':'Oczekuje na dopłatę',owner:upgradeOffer()?.needsQuote&&S.upgradeQuoteRequested?'Doradca':'Klient'});
 if(S.quoteRequested&&!S.quote)items.push({id:'quote',title:'Ustalenie ceny planu 1000+',type:'Plan',status:'Do wyceny',owner:'Doradca'});
 if(S.kycSubmitted&&!S.kyc)items.push({id:'identity',title:payerMatches()?'Weryfikacja danych tożsamości':'Niezgodność danych płatnika i klienta',type:'KYC / płatność',status:payerMatches()?'Do sprawdzenia':'Wymaga wyjaśnienia',owner:'Doradca'});
 for(const file of S.sourceImports)if(file.status!=='confirmed')items.push({id:'import:'+file.id,title:`Potwierdzenie odczytu: ${file.name}`,type:file.kind,status:'Odczyt do kontroli',owner:'Doradca'});
 if(!priorClientReady())items.push({id:'prior',title:'Historia PIT-38 i kosztów z wcześniejszych lat',type:'Poprzednie PIT-y',status:'Brak danych klienta',owner:'Klient'});else if(!priorReady())items.push({id:'prior',title:'Weryfikacja dokumentów i kosztów historycznych',type:'Poprzednie PIT-y',status:'Do sprawdzenia',owner:'Doradca'});
 if(hasOperations()&&!S.cashDone)items.push({id:'cash',title:'Wypłata 8 400 PLN w kantorze',type:'Wyjątek',status:S.proof?'Do decyzji':'Brak potwierdzenia',owner:S.proof?'Doradca':'Klient'});
 if(hasOperations()&&!S.bankDone)items.push({id:'bank',title:'Przelew 12 600 PLN na inny rachunek',type:'Wyjątek',status:S.noteSent?'Do decyzji':'Brak wyjaśnienia',owner:S.noteSent?'Doradca':'Klient'});
 return items;
}
let A={clientOpen:false,caseOpen:false,taskOpen:'',query:'',status:'all',owner:'all'};
function queuePage(){const matches=(!A.query||[clientName(),caseId(),S.profile.pesel,S.taxYear].join(' ').toLowerCase().includes(A.query.toLowerCase()))&&(A.status==='all'||A.status===statusLabel());return pageHead('Klienci i rozliczenia','Rozwiń klienta, wybierz rozliczenie i przejdź do konkretnych zadań. Wszystkie decyzje zapisują się w historii.')+`<div class="advisor-metrics"><div><strong>1</strong><span>klient</span></div><div><strong>1</strong><span>rozliczenie</span></div><div><strong>${problems().filter(x=>x.owner==='Doradca').length}</strong><span>zadań dla doradcy</span></div><div><strong>${importsPending()}</strong><span>odczytów do potwierdzenia</span></div></div><section class="card client-table-card"><div class="client-table-toolbar"><label class="tx-search"><span class="field-label">Znajdź klienta lub sprawę</span><input type="search" id="advisorSearch" value="${safe(A.query)}" placeholder="Nazwisko, PESEL, numer sprawy lub rok"></label><label class="filter-field"><span>Status rozliczenia</span><select id="advisorStatus">${['all','Przed płatnością','W przygotowaniu','Oczekuje na dopłatę','Do weryfikacji','Zatwierdzone'].map(v=>`<option value="${v}" ${A.status===v?'selected':''}>${v==='all'?'Wszystkie statusy':v}</option>`).join('')}</select></label></div><div id="advisorTableResults">${clientTable(matches)}</div></section><p class="table-caption">Prototyp pokazuje bieżącego klienta i jego sprawę. Połączenie obu paneli zachowuje wszystkie dane i decyzje.</p>`}
function clientTable(matches=true){if(!matches)return '<div class="empty-state compact"><h3>Brak pasujących klientów</h3><p>Zmień zapytanie lub status.</p></div>';return `<div class="table-scroll"><table class="clients-table"><thead><tr><th>Klient</th><th>Rozliczenia</th><th>KYC / płatność</th><th>Otwarte zadania</th><th>Ostatnia aktywność</th><th></th></tr></thead><tbody><tr class="client-row"><td><button type="button" class="client-expand" data-action="toggle-client" aria-expanded="${A.clientOpen}"><span class="expand-arrow">${A.clientOpen?'⌄':'›'}</span><span class="table-avatar">${safe(initials())}</span><span><strong>${safe(clientName())}</strong><small>${S.profile.pesel?'PESEL: '+safe(S.profile.pesel):'Dane jeszcze nieuzupełnione'}</small></span></button></td><td><strong>1</strong><small>PIT-38 · ${S.taxYear}</small></td><td>${pill(S.kyc?'KYC ✓':S.kycSubmitted?'KYC do sprawdzenia':'KYC przed klientem',S.kyc?'green':'amber')}<small>${S.payment.paid?'Opłacono '+money(totalPaid())+' zł':'Plan nieopłacony'}</small>${billingNeedsAction()?'<small class="billing-state-small">'+(upgradeOffer().needsQuote?'Wymagana wycena':'Do dopłaty '+money(upgradeOffer().due)+' zł')+'</small>':''}</td><td>${pill(problems().length+' otwarte',problems().length?'amber':'green')}</td><td>${safe(S.messages.at(-1)?.title||'Nowa sprawa')}</td><td>${button(A.clientOpen?'Zwiń':'Rozliczenia →','toggle-client','small secondary')}</td></tr>${A.clientOpen?`<tr class="expanded-client"><td colspan="6"><div class="client-calculations"><div class="nested-heading"><strong>Rozliczenia klienta</strong><span>${safe(clientName())}</span></div><table class="calculations-table"><thead><tr><th>Rozliczenie</th><th>Plan</th><th>Transakcje</th><th>Status</th><th>Problemy</th><th></th></tr></thead><tbody><tr><td><strong>PIT-38 · ${S.taxYear}</strong><small>${caseId()}</small></td><td>${safe(selectedPlan()?.name||'Nie wybrano')}</td><td class="mono">${operationCount()}<small class="${billingNeedsAction()?'billing-state-small':''}">${selectedPlan()?`limit ${Number.isFinite(selectedPlan().limit)?selectedPlan().limit:'1000+'}`:'bez planu'}</small></td><td>${pill(statusLabel(),S.approved?'green':'purple')}</td><td>${problems().filter(p=>p.owner==='Doradca').length} dla doradcy<br><small>${problems().filter(p=>p.owner==='Klient').length} czeka na klienta</small></td><td>${button(A.caseOpen?'Zwiń szczegóły':'Otwórz zadania →','toggle-case','small primary')}</td></tr>${A.caseOpen?`<tr><td colspan="6"><div class="case-workspace"><div class="case-workspace-head"><div><h2>Problemy do rozwiązania</h2><p>${caseId()} · ${safe(clientName())}</p></div>${button('Kontrola i zatwierdzenie →','go-approval','secondary small')}</div>${problemsTable()}<div class="case-quick-actions">${button('Dokumenty','go-documents','secondary small')}${button('Historia działań','go-messages','secondary small')}${button('Poproś o uzupełnienie','ask-more','secondary small')}</div></div></td></tr>`:''}</tbody></table></div></td></tr>`:''}</tbody></table></div>`}
function problemsTable(){const tasks=problems().filter(x=>A.owner==='all'||x.owner===A.owner);return `<div class="task-filter"><span>${tasks.length} zadań</span><label>Pokaż <select id="taskOwner"><option value="all" ${A.owner==='all'?'selected':''}>Wszystkie</option><option ${A.owner==='Doradca'?'selected':''}>Doradca</option><option ${A.owner==='Klient'?'selected':''}>Klient</option></select></label></div>${tasks.length?`<div class="table-scroll"><table class="problems-table"><thead><tr><th>Problem / zadanie</th><th>Obszar</th><th>Status</th><th>Po czyjej stronie</th><th></th></tr></thead><tbody>${tasks.map(task=>`<tr><td><strong>${safe(task.title)}</strong></td><td>${safe(task.type)}</td><td>${pill(task.status,task.owner==='Klient'?'amber':'purple')}</td><td>${task.owner}</td><td>${button(A.taskOpen===task.id?'Zwiń':'Rozwiń →','task-'+encodeURIComponent(task.id),'small secondary')}</td></tr>${A.taskOpen===task.id?`<tr class="task-detail-row"><td colspan="5"><div class="task-detail">${taskDetail(task.id)}</div></td></tr>`:''}`).join('')}</tbody></table></div>`:'<div class="note good">Brak otwartych zadań w tym widoku. Sprawdź listę końcową przed zatwierdzeniem.</div>'}`}

function taskDetail(id){if(id==='billing')return upgradeOffer()?.needsQuote&&S.upgradeQuoteRequested?upgradeQuoteDetail():billingCard('advisor');if(id==='identity')return identityDetail();if(id==='quote')return `<h3>Wycena indywidualna · ponad 1000 transakcji</h3><p>Ustal kwotę dla bieżącej sprawy. Klient zobaczy ją w kroku planu i płatności.</p><form id="quoteForm"><label class="form-field mt16"><span>Cena planu w PLN</span><input id="quotePrice" type="number" min="1" max="1000000" step="0.01" required></label><button type="submit" class="btn primary mt16">Zapisz wycenę</button></form>`;
 if(id.startsWith('import:')){const file=S.sourceImports.find(x=>x.id===id.slice(7));if(!file)return '';return `<h3>${safe(file.name)}</h3><p>${safe(file.provider||'Inne źródło')} · ${safe(file.kind)} · powiadomienie o nowym imporcie</p><div class="note warn">Odczyt jest symulowany. Poniższe wartości to przykład struktury odczytu, a nie dane rozpoznane z wybranego pliku. Można je poprawić przed potwierdzeniem.</div><div class="form-grid import-preview"><label class="form-field"><span>Data operacji</span><input type="date" data-import-id="${safe(file.id)}" data-import-field="date" value="${safe(file.preview.date)}"></label><label class="form-field"><span>Kwota</span><input type="number" step="0.01" data-import-id="${safe(file.id)}" data-import-field="amount" value="${safe(file.preview.amount)}"></label><label class="form-field"><span>Waluta</span><input type="text" maxlength="10" data-import-id="${safe(file.id)}" data-import-field="currency" value="${safe(file.preview.currency)}"></label></div><label class="checkline"><input type="checkbox" data-import-checked="${safe(file.id)}" ${file.reviewChecked?'checked':''}><span>Sprawdzono odczyt i wprowadzone poprawki w tej demonstracji.</span></label><div class="actions">${button('Potwierdź odczyt (demo)','confirm-import-'+file.id,'primary',!importCanConfirm(file))}</div>`}
 if(id==='prior')return `<h3>Historia PIT-38 i kosztów sprzed ${S.taxYear} roku</h3><div class="line"><span>Wcześniejsze PIT-y</span><strong>${safe({yes:'Składano PIT-38',no:'Nie składano PIT-38',unknown:'Brak pewności',unset:'Brak odpowiedzi'}[S.priorChoice])}</strong></div><div class="line"><span>Koszty historyczne</span><strong>${safe({yes:'Zadeklarowano koszty',no:'Brak kosztów',unknown:'Brak pewności',unset:'Brak odpowiedzi'}[S.priorCostChoice])}</strong></div>${S.priorCostNote?`<div class="box note-text">${safe(S.priorCostNote)}</div>`:''}${S.priorDocs.map(d=>`<div class="docrow"><span class="docicon">▤</span><div><h3>${safe(d.type)} · ${safe(d.year)}</h3><p>${safe(d.name)}</p></div></div>`).join('')}${!priorClientReady()?'<div class="note warn">Klient musi uzupełnić odpowiedzi i wymagane dokumenty. Nie można jeszcze potwierdzić kontroli.</div>':''}<div class="actions">${button('Poproś o uzupełnienie','ask-prior','secondary')}${button(S.priorReviewed?'Zweryfikowano ✓':'Potwierdź kontrolę (demo)','approve-prior','primary',!priorClientReady()||!needsPriorReview()||S.priorReviewed)}</div>`;
 if(id==='cash')return `<h3>Wypłata w kantorze · 8 400 PLN</h3><div class="box"><label>Potwierdzenie klienta</label><strong>${safe(S.proof?S.proofName:'Brak dokumentu')}</strong></div><label class="field-label mt16" for="cashCategory">Kategoria operacji</label><select id="cashCategory">${['Wypłata w kantorze','Przychód do analizy','Wymaga dodatkowych danych'].map(x=>`<option ${S.cashCategory===x?'selected':''}>${x}</option>`).join('')}</select><div class="actions">${button('Zatwierdź wyjątek','accept-cash','primary',!S.proof||S.cashCategory==='Wymaga dodatkowych danych')}${button('Poproś o uzupełnienie','ask-more','secondary')}</div>`;
 if(id==='bank')return `<h3>Rachunek osoby trzeciej · 12 600 PLN</h3><div class="box"><label>Wyjaśnienie klienta</label><div class="note-text">${safe(S.noteSent?S.note:'Brak wyjaśnienia')}</div></div><label class="field-label mt16" for="bankCategory">Kategoria operacji</label><select id="bankCategory">${['Przelew na rachunek osoby trzeciej','Operacja do rozliczenia','Wymaga dodatkowych danych'].map(x=>`<option ${S.bankCategory===x?'selected':''}>${x}</option>`).join('')}</select><div class="actions">${button('Zatwierdź wyjątek','accept-bank','primary',!S.noteSent||S.bankCategory==='Wymaga dodatkowych danych')}${button('Poproś o uzupełnienie','ask-more','secondary')}</div>`;return ''}
const importCanConfirm=file=>!!file.reviewChecked&&/^\d{4}-\d{2}-\d{2}$/.test(file.preview.date)&&Number.isFinite(Number(file.preview.amount))&&String(file.preview.amount).trim()!==''&&String(file.preview.currency).trim().length>0;
function reviewPage(){return pageHead('Zadania do sprawdzenia',`${safe(clientName())} · ${caseId()} · rozwiń zadanie, sprawdź materiały i zapisz decyzję.`)+`<div class="buttons mb20">${button('← Klienci i rozliczenia','go-queue','secondary')}${button('Kontrola końcowa →','go-approval','secondary')}</div><section class="card">${problemsTable()}</section>`}
function approvalPage(){const checks=[['Plan i dopłaty rozliczone',planSettled()],['Klient przekazał dane',S.clientSubmitted],['Tożsamość i powiązanie płatności',S.kyc],['Źródła danych',sourceCount()>0],['Odczyty CSV i zdjęć potwierdzone',importsPending()===0],['Poprzednie PIT-y i koszty',priorReady()],['Wyjątki rozpatrzone',pending()===0]];return pageHead('Kontrola końcowa',`${safe(clientName())} · ${caseId()} · zatwierdzenie pakietu po zamknięciu zadań.`)+`<div class="buttons mb20">${button('← Wróć do klientów','go-queue','secondary')}${button('Otwórz zadania','go-review','secondary')}</div><div class="grid"><section class="card">${cardhead('Lista kontrolna',pill(S.approved?'Zatwierdzono':canApprove()?'Gotowe':'Do uzupełnienia',S.approved?'green':'amber'))}${checks.map(([title,done])=>`<div class="line"><span>${title}</span>${pill(done?'Gotowe':'Brak',done?'green':'amber')}</div>`).join('')}<label class="checkline"><input id="reviewChecked" type="checkbox" ${S.reviewChecked?'checked':''} ${S.approved?'disabled':''}><span>Potwierdzam kontrolę materiałów i wykonuję demonstracyjną akceptację rozliczenia.</span></label><div class="actions">${button(S.approved?'Pakiet zatwierdzony ✓':'Zatwierdź pakiet (demo)','approve','primary',!canApprove()||!S.reviewChecked||S.approved)}</div></section><section class="card">${cardhead('Wynik do zatwierdzenia')}${resultDetails()}</section></div>`}
const docs=[['PIT-38','Podgląd deklaracji · PDF'],['Dane deklaracji','Przykładowy eksport · XML'],['Zestawienie wyliczeń','Arkusz zbiorczy · XLSX'],['Metodologia','Opis sposobu kalkulacji · PDF']];
function documentsPage(){return pageHead('Pakiet dokumentów',`${safe(clientName())} · PIT-38 za ${S.taxYear}`)+`<div class="grid"><section class="card">${cardhead('Dokumenty rozliczenia',pill(S.approved?'Zatwierdzone':'Wersje robocze',S.approved?'green':'amber'))}${docs.map(([title,desc],i)=>`<div class="docrow"><span class="docicon">▤</span><div class="source-copy"><h3>${title}</h3><p>${desc}</p></div>${button('Podgląd','preview-'+i,'small secondary')}</div>`).join('')}</section><section class="card">${cardhead('Status finalizacji')}<div class="note ${S.approved?'good':'warn'}">${S.approved?'Doradca zatwierdził pakiet w demonstracji.':'Finalny pakiet wymaga kontroli i zatwierdzenia doradcy.'}</div><p>Podglądy pokazują strukturę dokumentów. Nie są plikami do złożenia w urzędzie. Składanie PIT nie jest wykonywane w prototypie.</p>${FIXED_ROLE==='advisor'?`<div class="actions">${button('Kontrola końcowa','go-approval','secondary')}</div>`:''}</section></div>`}
function documentPreview(i){const name=docs[i]?.[0];if(!name)return;modal(name,`<p>Podgląd demonstracyjny, nie jest dokumentem do złożenia.</p><div class="paper"><span class="smallcaps">KryptoTax · makieta</span><h3>${safe(name)} · ${S.taxYear}</h3><div class="line"><span>Klient</span><strong>${safe(clientName())}</strong></div>${[['Przychody',caseTotals().income],['Koszty',caseTotals().cost],['Podatek',caseTotals().tax]].map(([l,v])=>`<div class="line"><span>${l} (demo)</span><strong>${operationCount()?money(v)+' PLN':'—'}</strong></div>`).join('')}<p style="text-align:center;letter-spacing:2px">MAKIETA — NIE SKŁADAĆ</p></div>`)}
function messagesPage(){return pageHead('Historia i wiadomości',`${safe(clientName())} · ${caseId()} · działania klienta i doradcy.`)+`<section class="card"><div class="timeline">${S.messages.slice().reverse().map(m=>`<div class="event"><b>${safe(m.title)}</b><p>${safe(m.desc)}</p>${m.time?`<time class="fine">${new Date(m.time).toLocaleString('pl-PL')}</time>`:''}</div>`).join('')}</div></section>`}
function page(){if(FIXED_ROLE==='advisor'){if(S.page==='queue'||S.page==='case')return queuePage();if(S.page==='review'||S.page==='priorReview')return reviewPage();if(S.page==='approval')return approvalPage()}if(S.page==='transactions')return transactionsPage();if(S.page==='documents')return documentsPage();if(S.page==='messages')return messagesPage();return ''}
function render(){el.innerHTML=scaffold();const nav=el.querySelector('.wizard-nav ol'),active=nav?.querySelector('[aria-current=step]');if(nav&&active&&nav.scrollWidth>nav.clientWidth){nav.scrollLeft=active.getBoundingClientRect().left-nav.getBoundingClientRect().left+nav.scrollLeft-(nav.clientWidth-active.offsetWidth)/2}}
function syncReviewButtons(){const b=el.querySelector('[data-action="accept-identity"]');if(b)b.disabled=!S.kycReviewChecked||!payerMatches()&&S.kycReviewNote.trim().length<10;for(const file of S.sourceImports){const button=el.querySelector(`[data-action="confirm-import-${CSS.escape(file.id)}"]`);if(button)button.disabled=!importCanConfirm(file)}}
function invalidateIdentity(){S.kycConfirmed=false;if(!S.kycSubmitted&&!S.kyc)return;S.kycSubmitted=false;S.kyc=false;S.kycReviewChecked=false;S.clientSubmitted=false;revokeApproval()}
function selectYear(year){if(!taxYears().includes(year))return;const old=S.taxYear;S.taxYear=year;S.taxYearConfirmed=true;if(!priorYears().includes(S.priorYear))S.priorYear=priorYears()[0];if(old!==year){S.priorReviewed=false;S.cashDone=false;S.bankDone=false;S.clientSubmitted=false;for(const file of S.sourceImports){file.status='pending';file.reviewChecked=false}revokeApproval();event('Zmieniono rok rozliczenia',`${old} → ${year}. Materiały zachowano do ponownego sprawdzenia.`)}save();render()}
function validProfile(stage){const keys=stage===0?[...personalFields.map(x=>x[0]),'sex']:documentFields.map(x=>x[0]);return keys.every(key=>String(S.profile[key]||'').trim())&&(stage!==0||/^\d{11}$/.test(S.profile.pesel))&&(stage!==1||S.kycFiles.front&&S.kycFiles.back&&S.profile.issueDate<=S.profile.expiryDate)}
function queueFiles(files,kind){let count=0;for(const f of files){if(!f.name||S.sourceImports.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified))continue;if(kind==='CSV'&&!/\.csv$/i.test(f.name)||kind==='Zdjęcie'&&!(/^image\//.test(f.type)||/\.(pdf|heic|heif|jpg|jpeg|png|webp)$/i.test(f.name))){toast('Wybierz plik w obsługiwanym formacie.');continue}S.sourceImports.push({id:uid(),name:f.name,size:f.size,lastModified:f.lastModified,kind,provider:S.otherSourceName.trim(),status:'pending',reviewChecked:false,preview:{date:`${S.taxYear}-06-10`,amount:'8400',currency:'PLN'},created:new Date().toISOString()});count++}if(count){revokeApproval();event('Nowe pliki — potwierdzenie odczytu',`Dodano ${count} plików (${kind}). W kolejce doradcy utworzono zadania potwierdzenia odczytu (demo).`);render();toast('Pliki dodane. Doradca ma nowe zadanie do sprawdzenia.')}else if(files.length)toast('Nie dodano nowych plików. Sprawdź format lub duplikaty.')}
function toggleTask(id){A.taskOpen=A.taskOpen===id?'':id;render()}

function fillTestData(){
 if(FIXED_ROLE!=='client'||S.approved)return;
 let changed=false,identityChanged=false;
 const example={firstNames:'Jan',lastName:'Kowalski',birthSurname:'Kowalski',father:'Adam',mother:'Anna',birthDate:'1990-01-01',birthPlace:'Warszawa',sex:'Mężczyzna',citizenship:'Polskie',pesel:'90010100016',docNumber:'ABC123456',issueDate:'2020-01-01',expiryDate:'2030-01-01',issuer:'Prezydent Miasta Warszawy'};
 for(const [key,value] of Object.entries(example))if(!String(S.profile[key]||'').trim()){S.profile[key]=value;changed=true;identityChanged=true}
 for(const [side,name] of [['front','DEMO_awers_dowodu.pdf'],['back','DEMO_rewers_dowodu.pdf']])if(!S.kycFiles[side]){S.kycFiles[side]=name;changed=true;identityChanged=true}
 if(identityChanged)invalidateIdentity();
 if(!S.plan){S.plan='1000';changed=true}
 if(!S.payment.payerName.trim()){S.payment.payerName=clientName();changed=true}
 if(!connectedExchanges().length){S.extraSources.push({id:'coinbase',name:'Coinbase'});changed=true}
 if(S.priorChoice==='unset'){S.priorChoice='no';changed=true}
 if(S.priorCostChoice==='unset'){S.priorCostChoice='no';changed=true}
 if(S.priorChoice==='yes'&&!hasPriorPIT()){const year=String(Number(S.taxYear)-1);S.priorDocs.push({year,type:'PIT-38',name:'DEMO_PIT38_'+year+'.pdf'});S.priorReviewed=false;changed=true}
 if(['yes','unknown'].includes(S.priorCostChoice)&&!S.priorCostNote.trim()){S.priorCostNote='Przykładowe koszty zakupu kryptowalut z wcześniejszego roku — dane testowe do demonstracji.';S.priorReviewed=false;changed=true}
 if(!S.proof){S.proof=true;S.proofName='DEMO_potwierdzenie_kantor.pdf';changed=true}
 if(!S.note.trim()){S.note='Dane testowe: przelew na rachunek członka rodziny — zwrot pożyczki.';changed=true}
 if(changed){revokeApproval();event('Uzupełniono dane testowe','Uzupełniono puste pola, demonstracyjne dokumenty i przykładową historię Coinbase. Płatność, wysłanie danych i decyzje pozostają osobnymi czynnościami.');render();toast('Puste pola uzupełnione danymi testowymi. Możesz przejść kolejne kroki.')}else toast('Dane są już uzupełnione. Zachowano wszystkie wpisane informacje.');
}

function action(a){
 if(a.startsWith('go-')){navTo(a.slice(3));return}
 if(a.startsWith('preview-')){documentPreview(Number(a.slice(8)));return}
 if(a.startsWith('task-')){toggleTask(decodeURIComponent(a.slice(5)));return}
 if(a.startsWith('connect-')){const x=exchanges.find(x=>x.id===a.slice(8));if(!x||S.approved||connectedExchanges().some(e=>e.id===x.id))return;S.extraSources.push({id:x.id,name:x.name});revokeApproval();event('Dodano giełdę',`${x.name}: wczytano demonstracyjną historię operacji po wykonaniu połączenia.`);render();toast(x.name+' dodana do źródeł (demo).');return}
 if(a.startsWith('kyc-stage-')){const n=Number(a.slice(10));if(n>=0&&n<=2&&(n<=S.kycStep||S.kycSubmitted)){S.kycStep=n;save();render()}return}
 if(a.startsWith('remove-prior-')){if(S.approved)return;const i=Number(a.slice(13));if(!Number.isInteger(i)||i<0||i>=S.priorDocs.length)return;S.priorDocs.splice(i,1);S.priorReviewed=false;revokeApproval();event('Usunięto dokument historyczny','Zaktualizowano listę wcześniejszych deklaracji.');render();return}
 if(a.startsWith('remove-import-')){if(S.approved)return;S.sourceImports=S.sourceImports.filter(x=>x.id!==a.slice(14));revokeApproval();event('Usunięto plik źródłowy','Zaktualizowano listę importów do kontroli.');render();return}
 if(a.startsWith('confirm-import-')){const file=S.sourceImports.find(x=>x.id===a.slice(15));if(FIXED_ROLE!=='advisor'||!file||!importCanConfirm(file))return;file.status='confirmed';event('Potwierdzono odczyt pliku',`${file.name}: doradca sprawdził demonstracyjny odczyt i zapisał ewentualne poprawki.`);A.taskOpen='';render();toast('Odczyt potwierdzony.');return}
 if(a.startsWith('tx-')){if(a==='tx-groups'){T.view='groups';T.page=1;render()}if(a==='tx-list'){T.view='list';T.page=1;render()}if(a==='tx-clear'){T={...T,query:'',source:'all',kind:'all',status:'all',page:1};render()}if(a==='tx-prev'||a==='tx-next'){T.page+=a==='tx-prev'?-1:1;updateTransactions()}return}
 switch(a){
 case'fill-test-data':fillTestData();break;
 case'open-upgrade':if(FIXED_ROLE==='client')openUpgrade();break;
 case'request-upgrade-quote':if(!billingNeedsAction()||!upgradeOffer().needsQuote||S.upgradeQuoteRequested)break;S.upgradeQuoteRequested=true;event('Prośba o wycenę po imporcie',`${operationCount()} operacji. Zapłacono ${money(totalPaid())} zł — kwota będzie odjęta od docelowej ceny.`);render();break;
 case'ask-topup':event('Prośba o dopłatę do planu','Doradca prosi o rozliczenie dopłaty w kroku źródeł danych lub w podsumowaniu.');toast('Prośba o dopłatę zapisana w historii sprawy.');break;
 case'confirm-year':S.taxYearConfirmed=true;save();navTo('plan');break;
 case'request-quote':S.quoteRequested=true;event('Prośba o wycenę',`Plan ponad 1000 transakcji · PIT-38 za ${S.taxYear}.`);render();break;
 case'show-source-catalog':document.getElementById('source-catalog')?.scrollIntoView({behavior:'smooth',block:'start'});document.querySelector('#source-catalog button:not(:disabled)')?.focus({preventScroll:true});break;
 case'edit-note':if(S.approved)break;S.noteSent=false;S.bankDone=false;S.clientSubmitted=false;save();render();document.getElementById('noteInput')?.focus();break;
 case'send-note':if(!S.note.trim()){toast('Najpierw wpisz wyjaśnienie.');break}S.noteSent=true;S.bankDone=false;revokeApproval();event('Klient dodał wyjaśnienie','Zapisano odpowiedź dotyczącą przelewu na inny rachunek.');render();break;
 case'submit-client':if(!clientReady()||S.clientSubmitted||S.approved)break;S.clientSubmitted=true;event('Klient przekazał sprawę',`PIT-38 za ${S.taxYear}. Dane i dokumenty czekają na decyzje doradcy.`);render();toast('Sprawa przekazana do weryfikacji.');break;

 if(t.id==='cashCategory'||t.id==='bankCategory'){S[t.id]=t.value;save();const b=el.querySelector('[data-action='+ (t.id==='cashCategory'?'accept-cash':'accept-bank') +']');if(b)b.disabled=t.value==='Wymaga dodatkowych danych'||(t.id==='cashCategory'?!S.proof:!S.noteSent);return}
 const txKeys={txSource:'source',txKind:'kind',txStatus:'status',txGrouping:'group',txSort:'sort',txPageSize:'pageSize'};

 const drawer=document.createElement('aside');drawer.dataset.uxEditorChrome='true';drawer.id='ux-editor-drawer';drawer.className='ux-editor-drawer'+(wasOpen?' is-open':'');drawer.setAttribute('role','dialog');drawer.setAttribute('aria-modal','true');drawer.setAttribute('aria-labelledby','ux-editor-heading');
 const chosen=UXD.tab==='all'?uxDecisions:items;
 drawer.innerHTML=`<header class="ux-editor-header"><div><span>WARSTWA PROJEKTOWA</span><h2 id="ux-editor-heading">Uwagi do makiety</h2></div><button type="button" data-action="uxd-close" aria-label="Zamknij uwagi">×</button></header><div class="ux-editor-not-product"><strong>TO NIE JEST CZĘŚĆ UI KLIENTA ANI DORADCY</strong><p>Pytania i notatki do omówienia procesu. Nie zmieniają danych ani decyzji w sprawie.</p></div><nav class="ux-editor-tabs" aria-label="Zakładki uwag"><button type="button" data-action="uxd-screen" aria-pressed="${UXD.tab==='screen'}" class="${UXD.tab==='screen'?'selected':''}">Ten ekran · ${items.length}</button><button type="button" data-action="uxd-all" aria-pressed="${UXD.tab==='all'}" class="${UXD.tab==='all'?'selected':''}">Wszystkie · ${uxDecisions.length}</button><button type="button" data-action="uxd-scenarios" aria-pressed="${UXD.tab==='scenarios'}" class="${UXD.tab==='scenarios'?'selected':''}">Scenariusze</button></nav><div class="ux-editor-body">${UXD.tab==='scenarios'?`<div class="ux-editor-intro"><h3>Podejrzyj stan procesu</h3><p>Pokazujemy przykładowy ekran klienta. Zapis sprawy pozostaje bez zmian.</p></div>${uxScenarioSelector()}`:`<div class="ux-editor-intro"><h3>${UXD.tab==='all'?'Decyzje dla całego procesu':'Do ustalenia na tym ekranie'}</h3><p>${UXD.tab==='all'?'Wybierz temat i zapisz ustalenie zespołu.':'Każdy temat opisuje obecny mock, otwarte pytania i wariant do omówienia.'}</p></div>${chosen.map(item=>uxDecisionHTML(item,UXD.selected===item.id)).join('')}`}</div><footer class="ux-editor-footer">Notatki zapisują się lokalnie. Oznaczenie „Omówione” nie wdraża zmiany w aplikacji.</footer>`;
 document.body.append(drawer);const body=drawer.querySelector('.ux-editor-body');body.scrollTop=UXD.scroll;if(!wasOpen)requestAnimationFrame(()=>drawer.classList.add('is-open'));
};
const uxdPreviousAction=action;
action=function(a){
 if(a==='uxd-open'||a==='uxd-screen'){uxDrawerOpen('screen');return}
 if(a==='uxd-all'){uxDrawerOpen('all');return}
 if(a==='uxd-scenarios'){uxDrawerOpen('scenarios');return}
 if(a==='uxd-close'){uxDrawerClose();return}
 if(a.startsWith('ux-preview-')&&uxScenarioNames[a.slice(11)]){UXD.open=false;UXD.scroll=0;uxdPreviousAction(a);return}
 if(['ux-preview-request','ux-preview-history','ux-preview-documents'].includes(a)){UXD.open=false;uxAttachReview()}
 uxdPreviousAction(a);
};
document.addEventListener('keydown',e=>{
 if(!UXD.open||document.querySelector('.modal'))return;
 if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();uxDrawerClose();return}
 if(e.key!=='Tab')return;const drawer=document.getElementById('ux-editor-drawer'),fields=drawer?[...drawer.querySelectorAll('button,input,textarea,select,a[href],summary')].filter(node=>!node.disabled&&node.getClientRects().length):[];if(!fields.length)return;const first=fields[0],last=fields.at(-1);if(!drawer.contains(document.activeElement)){e.preventDefault();first.focus()}else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
},true);

// Included operations and explicitly accepted excess-usage payments.
const planOverageCopy=plan=>plan.id==='custom'?'Limit i warunki nadwyżek według indywidualnej wyceny':`Każda ponad limit: ${money(plan.overageRate).replace(/,00$/,'')} zł / transakcję`;
function overageStatus(){const plan=selectedPlan(),count=operationCount(),limit=Number.isFinite(plan?.limit)?plan.limit:Infinity;const paidUnits=(S.payment.overages||[]).filter(receipt=>receipt.planId===S.plan&&receipt.taxYear===S.taxYear).reduce((sum,receipt)=>sum+Math.max(0,Number(receipt.units)||0),0);const units=Math.max(0,count-limit),unpaidUnits=Math.max(0,units-paidUnits),rate=Number(plan?.overageRate)||0;return {count,limit,units,paidUnits,unpaidUnits,rate,due:Math.round(unpaidUnits*rate*100)/100}}
totalPaid=()=>Math.round((Math.max(0,Number(S.payment.amount)||0)+[...(S.payment.upgrades||[]),...(S.payment.overages||[])].reduce((sum,payment)=>sum+Math.max(0,Number(payment.amount)||0),0))*100)/100;
planSettled=()=>!!S.payment.paid&&!!selectedPlan()&&planPrice()>0&&totalPaid()>=planPrice()&&overageStatus().unpaidUnits===0;
billingNeedsAction=()=>!!S.payment.paid&&!planSettled();
upgradeOffer=function(){
 const current=selectedPlan(),count=operationCount();if(!current||!S.payment.paid)return null;
 const exceeded=count>current.limit,target=exceeded?(plans.find(plan=>count<=plan.limit)||plans.at(-1)):current;
 const price=target.id==='custom'?(current.id==='custom'?Number(S.quote)||0:Number(S.upgradeQuote)||0):target.price;
 const paid=totalPaid(),due=Math.max(0,Math.round((price-paid)*100)/100),usage=overageStatus(),needsQuote=target.id==='custom'&&!price;
 const canPayOverage=usage.unpaidUnits>0&&usage.rate>0;
 return {current,target,count,exceeded,price,paid,due,usage,needsQuote,canPayOverage,needed:!planSettled(),saving:canPayOverage?Math.round((usage.due-due)*100)/100:0,recommendUpgrade:!needsQuote&&(!canPayOverage||due<=usage.due)};
};
paymentLedger=function(){return `<div class="payment-ledger"><div><span>Opłata za pierwszy plan</span><strong>${money(S.payment.amount)} zł</strong><small>${safe(S.payment.transactionId)}</small></div>${(S.payment.upgrades||[]).map(payment=>`<div><span>${payment.amount?'Dopłata do planu':'Zmiana planu bez dopłaty'} · ${safe(plans.find(plan=>plan.id===payment.to)?.name||payment.to)}</span><strong>${money(payment.amount)} zł</strong><small>${safe(payment.transactionId)}</small></div>`).join('')}${(S.payment.overages||[]).map(payment=>`<div><span>Overage · ${payment.units} × ${money(payment.rate)} zł · rok ${safe(payment.taxYear)}</span><strong>${money(payment.amount)} zł</strong><small>${safe(payment.transactionId)}</small></div>`).join('')}<div class="ledger-total"><span>Łącznie zapłacono</span><strong>${money(totalPaid())} zł</strong></div></div>`};
function pricingExampleCard(){return `<div class="pricing-example"><span>PRZYKŁAD · 250 TRANSAKCJI</span><div><p>Plan 100 + overage<br><strong>1000 zł + 150 × 20 zł = 4000 zł</strong></p><span aria-hidden="true">→</span><p>Plan do 1000<br><strong>2000 zł łącznie</strong></p><b>2000 zł mniej z większym planem</b></div><small>Nadwyżki mają wyższą stawkę jednostkową. Przy niewielkim przekroczeniu mogą być tańsze — po imporcie porównamy faktyczne kwoty.</small></div>`}
billingCard=function(context='sources'){
 const offer=upgradeOffer();if(!offer)return '';const {current,target,count,price,paid,due,usage,needed,needsQuote,canPayOverage,recommendUpgrade,saving}=offer,advisor=context==='advisor';
 if(!needed)return `<section class="billing-usage"><div><strong>${count} <span>/ ${Number.isFinite(current.limit)?current.limit:'1000+'} w cenie</span></strong><small>${safe(current.name)}${usage.paidUnits?` + ${usage.paidUnits} opłaconych ponad limit`:''} · zapłacono ${money(paid)} zł</small></div><div class="billing-meter" aria-hidden="true"><span style="width:${Number.isFinite(current.limit)?Math.min(100,count/(current.limit+usage.paidUnits)*100):100}%"></span></div>${pill(usage.units?'Nadwyżka rozliczona':'W limicie planu','green')}</section>`;
 const upgradeButton=needsQuote?button(S.upgradeQuoteRequested?'Wycena w toku ✓':'Poproś o indywidualną wycenę','request-upgrade-quote',recommendUpgrade?'primary':'secondary',S.upgradeQuoteRequested):button(due?'Zwiększ plan · dopłać '+money(due)+' zł →':'Zwiększ plan bez dopłaty →','open-upgrade',recommendUpgrade?'primary':'secondary');
 return `<section class="billing-card overage-billing"><div class="billing-heading"><span class="billing-alert-icon">↗</span><div><span class="eyebrow">LIMIT W CENIE I OPŁATA ZA NADWYŻKĘ</span><h2>${usage.units?`Masz ${count} operacji. W cenie planu jest ${usage.limit}.`:'Pozostała kwota do opłacenia'}</h2><p>${usage.unpaidUnits?`${usage.unpaidUnits} operacji ponad opłacony limit wymaga rozliczenia. Porównaj overage z przejściem na większy plan.`:'Dane i wpłaty są zachowane. Rozlicz pozostałą kwotę przed przekazaniem sprawy.'}</p></div>${pill(needsQuote?'Wycena lub overage':'Do rozliczenia','amber')}</div><div class="overage-comparison">${canPayOverage?`<article class="overage-option ${!recommendUpgrade&&!needsQuote?'best':''}"><span class="overage-option-label">ZOSTAJESZ W OBECNYM PLANIE</span><h3>${safe(current.name)}</h3><div class="overage-formula">${usage.unpaidUnits} nadwyżki × ${money(usage.rate)} zł</div><div class="overage-option-amount"><span>Teraz do dopłaty</span><strong>${money(usage.due)} zł</strong></div><p>Łącznie z dotychczasowymi wpłatami: <strong>${money(paid+usage.due)} zł</strong></p>${!recommendUpgrade&&!needsQuote?'<div class="overage-saving">Najniższa dopłata przy tej liczbie operacji</div>':''}${!advisor?button('Rozlicz nadwyżkę (overage)','open-overage',!recommendUpgrade&&!needsQuote?'primary':'secondary'):''}</article>`:''}<article class="overage-option upgrade-option ${recommendUpgrade?'best':''}"><span class="overage-option-label">${recommendUpgrade?'REKOMENDOWANE · WIĘKSZY PLAN':'ALTERNATYWA · WIĘKSZY PLAN'}</span><h3>${safe(target.name)}</h3><div class="overage-formula">${needsQuote?'Pełna cena do ustalenia':`Cena planu ${money(price)} zł − zapłacono ${money(paid)} zł`}</div><div class="overage-option-amount billing-due"><span>Teraz do dopłaty</span><strong>${needsQuote?'Po wycenie':money(due)+' zł'}</strong></div><p>${needsQuote?'Wcześniejsze wpłaty odliczymy od wyceny.':`Łączne wpłaty po zmianie: <strong>${money(paid+due)} zł</strong>`}</p>${recommendUpgrade&&canPayOverage?`<div class="overage-saving">${saving>0?'Dopłata niższa o '+money(saving)+' zł niż overage':'Ta sama dopłata, a większy limit w cenie'}</div>`:''}${!advisor?upgradeButton:''}</article></div><div class="billing-actions">${advisor?button('Poproś klienta o rozliczenie','ask-topup','secondary small'):''}<p>${advisor?'Klient wybiera sposób rozliczenia w swoim panelu. Do tego czasu zatwierdzenie jest zablokowane.':'Możesz nadal dodawać dane. '+(S.clientSubmitted?'Zatwierdzenie':'Przekazanie sprawy')+' wymaga opłacenia nadwyżki albo zwiększenia planu. KYC i dokumenty pozostają zapisane.'}</p></div><small class="billing-count-note">Overage jest liczone od operacji ponad opłacony limit. Opłaconych już nadwyżek nie naliczamy ponownie. W prototypie liczymy operacje widoczne w historii.</small></section>`
};
function openOverage(){const offer=upgradeOffer();if(FIXED_ROLE!=='client'||!offer?.needed||!offer.canPayOverage)return;const u=offer.usage;modal('Rozliczenie nadwyżki operacji',`<p>Pozostajesz w planie ${safe(offer.current.name.toLowerCase())}. Nadwyżka zostanie rozliczona jako osobna opłata demonstracyjna.</p><div class="upgrade-breakdown"><div class="line"><span>W cenie planu</span><strong>${u.limit} operacji</strong></div><div class="line"><span>Już opłacone ponad limit</span><strong>${u.paidUnits}</strong></div><div class="line"><span>Nowa nadwyżka</span><strong>${u.unpaidUnits} × ${money(u.rate)} zł</strong></div><div class="upgrade-total"><span>Opłata overage</span><strong>${money(u.due)} zł</strong></div></div>${offer.recommendUpgrade?`<div class="note warn"><strong>Większy plan jest ${offer.saving>0?'tańszy o '+money(offer.saving)+' zł':'w tej samej cenie'}.</strong> Zamiast overage możesz dopłacić ${money(offer.due)} zł do planu ${safe(offer.target.name.toLowerCase())}.</div><div class="buttons">${button('Wybierz większy plan →','open-upgrade')}</div>`:''}<form id="overageForm" data-plan-id="${S.plan}" data-units="${u.unpaidUnits}" data-amount="${u.due}"><p>Płatnik: <strong>${safe(S.payment.payerName)}</strong>. Płatność w prototypie nie pobiera pieniędzy.</p><button class="btn ${offer.recommendUpgrade?'secondary':'primary'} upgrade-submit" type="submit">${offer.recommendUpgrade?'Mimo to rozlicz overage':'Rozlicz overage'} · ${money(u.due)} zł (demo)</button></form>`)}
function completeOverage(form){const offer=upgradeOffer();if(FIXED_ROLE!=='client'||!offer?.needed||!offer.canPayOverage)return;const u=offer.usage;if(form.dataset.planId!==S.plan||Number(form.dataset.units)!==u.unpaidUnits||Number(form.dataset.amount)!==u.due){toast('Liczba operacji zmieniła się. Sprawdź zaktualizowaną dopłatę.');openOverage();return}S.payment.overages.push({planId:S.plan,taxYear:S.taxYear,units:u.unpaidUnits,rate:u.rate,amount:u.due,payerName:S.payment.payerName,transactionId:'DEMO-OV-'+uid().slice(0,8).toUpperCase(),time:new Date().toISOString()});S.upgradeQuoteRequested=false;event('Rozliczono overage',`${u.unpaidUnits} operacji × ${money(u.rate)} zł = ${money(u.due)} zł. Plan pozostał bez zmian; opłaconych operacji nie naliczamy ponownie.`);closeModal();render();toast('Nadwyżka rozliczona w demonstracji. Dane i KYC zachowane.')}
const overagePreviousAction=action;
action=function(a){if(a==='open-overage'){openOverage();return}overagePreviousAction(a)};
document.addEventListener('submit',e=>{if(e.target.id==='overageForm'){e.preventDefault();completeOverage(e.target)}});
const overagePreviousPlanPage=planPage;
planPage=function(){let html=overagePreviousPlanPage();const slots='<div class="equal mt20">';if(html.includes(slots))html=html.replace(slots,pricingExampleCard()+slots);return html};

save();render();
})();

</script></body></html>
