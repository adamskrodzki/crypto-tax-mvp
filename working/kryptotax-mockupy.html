/* Adapted from the source, wizard, transaction and advisor layouts of KryptoTax. */
:root{--sub:#586984;--purple:#4d54c8}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #5860d5;outline-offset:3px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.presentation{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px 14px;padding:7px 20px;border-bottom:1px solid #dde4ee;background:#eaf0f8;color:#435674;font-size:12px}
.presentation-controls{display:flex;gap:5px 7px;align-items:center;flex-wrap:wrap}
.presentation-controls button,.presentation-controls select{font:inherit;border:1px solid #cfd9e8;border-radius:7px;padding:4px 7px;background:#f8faff;color:#32466a}
.presentation-controls button[aria-pressed=true]{background:#dae2fc;border-color:#adbbeb;font-weight:700}
.presentation-controls label{display:flex;gap:5px;align-items:center}
#app .shell{min-height:calc(100vh - 42px);grid-template-columns:218px minmax(0,1fr)}
#app .sidebar{height:calc(100vh - 42px);min-width:0}
#app .content{width:100%;max-width:1210px;margin:auto;padding:23px clamp(14px,3vw,34px) 40px}
#app .wizard-heading h1{font-size:clamp(26px,4vw,37px);line-height:1.15;letter-spacing:-.035em}
#app .top{position:static;min-height:56px;padding:12px 24px}
#app .main,#app .content,#app .wizard-body,.kt-grid>*,.kt-source-layout>*{min-width:0}
#app .card{box-shadow:0 2px 9px #18284508;border:1px solid var(--line)}
#app .wizard-nav-step:disabled{cursor:default;opacity:.7}
#app .logo-text small{color:#b4c3e6}
#app .wizard-intro{margin-bottom:17px}
#app .source{display:flex;align-items:center;gap:11px}
#app .source>div{min-width:0}
#app .source>button{margin-left:auto;flex:none}
#app .source .pill{width:max-content}
#app .src-state{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px}
#app .source.active{border-color:#aeb9ed;background:#f6f7ff}
#app .sourceIcon{display:grid;place-items:center;min-width:34px;min-height:34px;color:#3e489f;background:#eaedff;font-size:12px;font-weight:750}
#app .source-copy{flex:1}
#app .source-copy b,#app .source-copy small{display:block}
#app .source-copy small{color:var(--sub);margin-top:2px}
#app .eyebrow{letter-spacing:.075em}
#app .note,.kt-dialog .note{line-height:1.5}
#app fieldset,.kt-dialog fieldset{border:0;margin:0;padding:0;min-width:0}
#app fieldset legend,.kt-dialog fieldset legend{font-size:14px;font-weight:700;padding:0;margin-bottom:8px}
.kt-group{border-top:1px solid var(--line);padding:13px 0}
.kt-group:first-of-type{margin-top:15px}
.kt-options{display:flex;align-items:stretch;gap:7px;flex-wrap:wrap}
.kt-check{display:flex;gap:9px;align-items:flex-start;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--ink);background:#fff}
.kt-check:has(input:checked){background:#eff1ff;border-color:#aeb9ed}
.kt-check input{flex:none;width:16px;height:16px;margin:2px 0 0;accent-color:var(--purple)}
.kt-check strong,.kt-check small{display:block}
.kt-check small{color:var(--sub);margin-top:3px}
.kt-stack>*+*{margin-top:11px}
.kt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;align-items:start}
.kt-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kt-source-layout{display:grid;grid-template-columns:minmax(285px,.9fr) minmax(0,1.25fr);gap:14px;align-items:start}
.kt-method{border:1px solid var(--line);padding:13px;border-radius:11px}
.kt-method p,.kt-copy p{color:var(--sub);margin:5px 0}
.kt-method h3,.kt-copy h3,.kt-group h3{margin:0 0 6px;font-size:15px}
.kt-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kt-field{display:block;font-size:13px;font-weight:700;margin:9px 0 6px}
.kt-field span{display:block;margin-bottom:5px}
#app .kt-field input:not([type=checkbox]):not([type=radio]),#app .kt-field select,#app .kt-field textarea,
.kt-dialog input:not([type=radio]),.kt-dialog textarea,.kt-dialog select{max-width:100%;width:100%;font:inherit;border:1px solid #cbd5e4;border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
#app input[type=file],.kt-dialog input[type=file]{font-size:12px;padding:6px;max-width:100%}
.kt-field textarea,.kt-dialog textarea{resize:vertical}
.kt-field small,.kt-muted{font-size:12px;color:var(--sub);font-weight:500}
.kt-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.kt-rule{margin:14px 0;border:0;border-top:1px solid var(--line)}
.kt-kv{display:grid;gap:0;margin:6px 0}
.kt-kv>div{display:grid;grid-template-columns:minmax(112px,.8fr) minmax(0,1.2fr);gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kt-kv>div:last-child{border-bottom:0}
.kt-kv dt{color:var(--sub)}
.kt-kv dd{margin:0;overflow-wrap:anywhere;text-align:right}
.kt-asset{font-variant-numeric:tabular-nums;white-space:nowrap}
.kt-hash{font-family:ui-monospace,monospace;overflow-wrap:anywhere;font-size:12px}
.kt-error{color:#9a3329;font-size:13px;margin-top:8px}
.kt-tabs{display:flex;gap:7px;align-items:center;overflow:auto;padding:0 0 11px}
.kt-tabs button{white-space:nowrap}
.kt-tabs button[aria-current=page]{background:var(--purple2);border-color:#b4beef;color:var(--purple)}
.kt-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}
.kt-title h1{margin:4px 0 5px;line-height:1.12}
.kt-title p{margin:0;color:var(--sub)}
.kt-task-list button{width:100%;text-align:left;white-space:normal;justify-content:flex-start;display:block;margin-bottom:7px}
.kt-task-list button[aria-pressed=true]{border-color:#aeb9ed;background:#eff1ff}
.kt-task-list button small{display:block;color:var(--sub);margin:4px 0}
.kt-task-layout{display:grid;grid-template-columns:minmax(230px,.7fr) minmax(0,1.4fr);gap:13px;align-items:start}
.kt-task-layout>*{min-width:0}
.kt-line{display:flex;justify-content:space-between;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.kt-line:last-child{border-bottom:0}
.kt-dialog{max-height:calc(100dvh - 28px);width:min(630px,calc(100vw - 28px));border:1px solid var(--line);border-radius:14px;padding:0;color:var(--ink);box-shadow:0 18px 65px #131f3766;overflow:auto}
.kt-dialog::backdrop{background:#121c34a3}
.kt-dialog-inner{padding:19px}
.kt-dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:11px}
.kt-dialog-head h2{font-size:21px;margin:0}
.kt-dialog p{color:var(--sub)}
.kt-dialog .paper{background:#f8faff;border-radius:11px;padding:12px;border:1px solid var(--line)}
.kt-dialog .kt-check+.kt-check{margin-top:7px}
.kt-price{font-size:27px;letter-spacing:-.025em;font-weight:750}
.kt-state-tag{margin:0 0 6px}
.kt-wrap{overflow-wrap:anywhere}
.kt-client-tabs{margin-top:14px}
.kt-reply{border-left:2px solid #cfd8f8;padding:0 0 0 10px;margin-top:9px;overflow-wrap:anywhere}
.kt-reply p{white-space:pre-wrap;margin:3px 0}
.kt-hero{background:#eef1ff;color:#243768;border:1px solid #dbe0fa;border-radius:12px;padding:14px}

"use strict";

const cardhead=(title,right='')=>`<div class="cardhead"><h2>${title}</h2>${right}</div>`;
const stat=(title,value,caption)=>`<div class="stat"><div class="stat-label">${title}</div><div class="stat-value mono">${value}</div><div class="stat-caption">${caption}</div></div>`;
function filterSelect(id,label,values,current){return `<label class="filter-field"><span>${label}</span><select id="${id}"><option value="all">Wszystkie</option>${values.map(v=>`<option value="${safe(v)}" ${v===current?'selected':''}>${safe(v)}</option>`).join('')}</select></label>`}
const STORAGE = "kryptotax-boss-derived-v2";
const YEARS = [2025,2024];
const IMPORT_PRICE = 79;
const GROUPS = [
  {id:"exchange",name:"Giełdy",description:"Wybierz giełdy, z których korzystałeś."},
  {id:"wallet",name:"Własne portfele",description:"Wybierz sieci, na których masz historię."},

const SOURCES = [

  {id:"coinbase",name:"Coinbase",group:"exchange",icon:"C"},
  {id:"kraken",name:"Kraken",group:"exchange",icon:"K"},
  {id:"ethereum",name:"Ethereum",group:"wallet",icon:"ETH"},
  {id:"bitcoin",name:"Bitcoin",group:"wallet",icon:"BTC"},
  {id:"cash",name:"Kantor lub bitomat",group:"other",icon:"PLN"},
  {id:"card",name:"Płatności kartą krypto",group:"other",icon:"K"}
];
const source = id => SOURCES.find(item=>item.id===id);
const NETWORKS = {
  ethereum:{
    asset:"ETH", exchange:"coinbase", day:"06-18", time:"12:42:18", qty:"0,4000",
    address:"0x7b36c6a0d4b4a9b19d11b7ea2cdd790bfac84061",
    from:"0x22aa86ea9f6d82d83f64dc3d194c66bfb20e1797",
    hash:"0x3fc701bd1cc8ca0f4ec6251d6aaa12f37dd79315b584e6e2d5f194f7abc0",
    pattern:/^0x[0-9a-fA-F]{40}$/
  },
  bitcoin:{

    address:"1LBkX4RBQ3kweMGUDvjXuw7i2tAw36YwtX",
    from:"15CPH4uUe53h2jYpxWPBrwsasw2G1fu3pk",
    hash:"638fac999fc389b28ca94d6ed2be32767638df657aa16bc946d53fec11df",
    pattern:/^[13][1-9A-HJ-NP-Za-km-z]{25,34}$|^bc1[0-9a-z]{25,87}$/

const app = document.querySelector("#app");
const dialog = document.querySelector("#dialog");
const today = () => new Date().toISOString();
const dateLabel = value => value ? value.slice(0,10).split("-").reverse().join(".") : "—";
const cash = n => money(n)+" zł";
const rounded = n => Math.round(n*100)/100;
const caseRef = c => "KT-"+c.year+"-"+c.number;
const nameInitials = name => name.split(" ").map(part=>part[0]).slice(0,2).join("");
const fields = rows => '<dl class="kt-kv">'+rows.map(([label,value])=>'<div><dt>'+label+'</dt><dd>'+value+'</dd></div>').join("")+'</dl>';
const note = (text,style="") => '<div class="note '+style+'">'+text+'</div>';
const submit = (label,style="primary") => '<button type="submit" class="btn '+style+'">'+label+'</button>';
const error = '<p class="kt-error" role="alert" hidden></p>';
const report = (title,body) => `<section class="card kt-copy">${cardhead(title)}${body}</section>`;
function baseCase(id,name,number,year=2025) {
  return {id,name,number,year,stage:"setup",selected:[],imports:{},priorAnswer:"",
    prior:null,work:{},events:[],charges:[],plan:null,paid:null,verified:false,sent:"",approved:""};
}
function op(sourceId,id,date,kind,description,amountPLN,effect) {
  return {sourceId,id,date,kind,description,amountPLN,effect};
}
function transferOp(c,network,isWallet) {
  const n=NETWORKS[network];
  const day=c.year+"-"+n.day;
  const id=network==="ethereum"?"ETH":"BTC";
  const transfer=op(isWallet?network:n.exchange,
    isWallet?"PORT-"+id+"-01":n.exchange.toUpperCase()+"-"+id+"-04",
    day,isWallet?"Wpływ "+n.asset:"Wypłata "+n.asset,
    isWallet?"Wpływ na wskazany portfel":"Wypłata na adres blockchain",null,"outside");
  return {...transfer,network,asset:n.asset,quantity:n.qty,from:n.from,to:n.address,
    hash:n.hash+c.year,time:n.time,direction:isWallet?"in":"out"};
}
function exchangeRows(c,id) {
  const key={coinbase:"CB",binance:"BN",kraken:"KR"}[id];
  const values={
    coinbase:[["03-04","Zakup BTC",4800,"cost"],["04-11","Zakup ETH",5500,"cost"],["08-13","Sprzedaż BTC",15600,"income"]],
    binance:[["02-06","Zakup BTC",7100,"cost"],["08-11","Sprzedaż BTC",12300,"income"]],
    kraken:[["02-08","Zakup BTC",2400,"cost"],["04-25","Zakup ETH",2800,"cost"],["10-02","Sprzedaż BTC i ETH",9200,"income"]]
  }[id];
  const rows=values.map(([day,kind,amount,effect],index)=>op(id,key+"-00"+(index+1),c.year+"-"+day,kind,
    effect==="income"?"Wymiana na PLN":"Zakup z salda PLN",amount,effect));
  if(id==="coinbase") rows.push(transferOp(c,"ethereum",false));
  if(id==="binance") rows.push(transferOp(c,"bitcoin",false));
  return rows;
}
function imported(c,id,method,file="",address="") {
  const network=NETWORKS[id];
  const known=network && equalAddress(id,address,network.address);
  return {
    method,file,address,period:"01.01–31.12."+c.year,
    rows:network ? (known ? [transferOp(c,id,true)] : []) : exchangeRows(c,id)
  };
}
function equalAddress(network,a,b) {
  if(network==="ethereum") return a?.toLowerCase()===b?.toLowerCase();
  return a===b;
}
function ledger(c) {
  return c.selected.flatMap(id=>c.imports[id]?.rows??[]).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
}
function pairedWith(c,row,rows=ledger(c)) {
  if(!row.network || !equalAddress(row.network,c.imports[row.network]?.address,row.to)) return null;
  return rows.find(other=>other.id!==row.id && other.sourceId!==row.sourceId &&
    other.network===row.network && other.hash===row.hash && other.direction!==row.direction &&
    other.quantity===row.quantity && other.asset===row.asset &&
    equalAddress(row.network,other.to,row.to) && equalAddress(row.network,other.from,row.from));
}
function taskType(c,row,rows) {
  return row.issue || (row.network && !pairedWith(c,row,rows) ? "transfer" : "");
}
const getWork = (c,id) => c.work[id]??{intake:null,questions:[],decision:null};
const ensureWork = (c,id) => c.work[id]??=( {intake:null,questions:[],decision:null} );
const lastQuestion = (c,id) => getWork(c,id).questions.at(-1);
const waiting = (c,id) => Boolean(lastQuestion(c,id) && !lastQuestion(c,id).reply);
function workItems(c) {
  const rows=ledger(c);
  const tasks=rows.flatMap(row=>{
    const type=taskType(c,row,rows);
    return type ? [{...row,issue:type}] : [];
  });
  if(c.prior && c.priorAnswer!=="no" && c.prior.choice!=="none") {
    tasks.push({id:"PIT-"+(c.year-1),issue:"prior",kind:"Koszty z wcześniejszego PIT-38",amountPLN:c.prior.amount});
  }
  return tasks;
}
const findTask = (c,id) => workItems(c).find(item=>item.id===id);
const unresolved = c => workItems(c).filter(item=>!getWork(c,item.id).decision);
const readyToWork = c => unresolved(c).filter(item=>!waiting(c,item.id));
const nextIntake = c => workItems(c).find(item=>item.issue!=="prior" && !getWork(c,item.id).intake);
const missingSources = c => c.selected.filter(id=>!c.imports[id]?.rows.length && !c.imports[id]?.noOps);
const hasHistory = c => ledger(c).length>0;
const canPrepare = c => hasHistory(c) && !missingSources(c).length;
const canQuote = c => canPrepare(c) && !nextIntake(c) && (c.priorAnswer==="no" || c.prior);
const canApprove = c => Boolean(c.sent && c.paid && c.verified && canPrepare(c) && !unresolved(c).length);
function spec(c,item) {
  if(item.issue==="cash") return {
    title:"Ustalenie, czy wypłata była osobną wymianą",
    reason:"Dokument wypłaty pokazuje datę i kwotę gotówki. Do ustalenia pozostaje, czy środki pochodzą z osobnej wymiany.",
    question:"Skąd pochodziły środki wypłacone w kantorze?",
    options:[["sale","Wymieniłem kryptowaluty na gotówkę w kantorze"],["balance","Odebrałem środki po wcześniejszej sprzedaży"],["unknown","Nie wiem"]],
    request:"Czy kantor wymienił kryptowaluty na gotówkę przy tej wypłacie? Dołącz potwierdzenie wymiany lub podaj jej numer.",
    outcomes:[["income","Ujmij udokumentowaną wymianę"],["outside","Potwierdź wypłatę wcześniej ujętych środków"]]
  };
  if(item.issue==="card") return {
    title:"Ustalenie źródła środków na płatność kartą",
    reason:"Potwierdzenie płatności zawiera kwotę w PLN. Brakuje informacji, czy karta pobrała saldo w PLN, czy przy płatności nastąpiła osobna wymiana kryptowalut.",
    question:"Z jakiego salda opłacono tę transakcję?",
    options:[["crypto","Przy płatności wymieniono kryptowaluty"],["fiat","Płatność zeszła z salda w walucie tradycyjnej"],["unknown","Nie wiem"]],
    request:"Dołącz potwierdzenie obciążenia salda przez wystawcę karty. Jeśli przy płatności była wymiana kryptowalut, podaj jej identyfikator.",
    outcomes:[["income","Ujmij potwierdzoną odrębną wymianę"],["outside","Potwierdź płatność z salda PLN lub wcześniej ujętą wymianę"]]
  };
  if(item.issue==="prior") return {
    title:"Ustalenie kosztów z wcześniejszego rozliczenia",
    reason:"Sprawdź wcześniejszy PIT-38 i potwierdź kwotę kosztów do uwzględnienia w bieżącym rozliczeniu.",
    request:"Czy masz ostatni PIT-38 z rozliczeniem kryptowalut? Dołącz go i wskaż kwotę kosztów do sprawdzenia.",
    outcomes:[["cost","Potwierdź udokumentowaną kwotę kosztów"],["outside","Zamknij sprawdzenie bez doliczania kosztów"]]
  };
  const suggested = item.direction==="out" ? source(item.network).name : source(NETWORKS[item.network].exchange).name;
  return {
    title:"Ustalenie drugiego źródła transferu",
    reason:"Import zawiera transfer na "+source(item.network).name+". Nie znaleziono odpowiadającego zapisu w dodanych źródłach.",
    question:item.direction==="out"?"Czy adres odbiorcy należy do Ciebie?":"Skąd przyszedł ten transfer na Twój portfel?",
    options:[["own",item.direction==="out"?"To mój portfel":"Z innego mojego portfela lub giełdy"],
      ["other","Transfer z udziałem innej osoby lub podmiotu"],["unknown","Nie wiem"]],
    request:"Wskaż, do kogo należał drugi adres w tej transakcji, i dołącz potwierdzenie z historii drugiego źródła, jeśli je masz.",
    outcomes:[["outside","Udokumentuj transfer bez odrębnej wymiany"],["income","Ujmij odrębną wymianę z potwierdzoną wartością"]],
    suggested
  };
}
function pendingEffect(item,decision) {
  if(decision) return {kind:decision.code,value:decision.amountPLN??item.amountPLN??0};
  if(item.issue) return {kind:"pending",value:item.amountPLN??0};
  return {kind:item.effect,value:item.amountPLN??0};
}
function calculation(c) {
  const rows=ledger(c);
  const tasks=workItems(c);
  const extras={income:0,cost:0};
  const totals={income:0,cost:0};
  for(const row of [...rows,...tasks.filter(item=>item.issue==="prior")]) {
    const item=tasks.find(task=>task.id===row.id)??row;
    const result=pendingEffect(item,getWork(c,item.id).decision);
    if(result.kind==="income" || result.kind==="cost") totals[result.kind]+=result.value;
    if(result.kind==="pending") extras[item.issue==="prior"?"cost":"income"]+=result.value;
  }
  const simulateTax=(income,cost)=>Math.round(Math.max(0,income-cost)*0.19);
  return {...totals,tax:simulateTax(totals.income,totals.cost),
    low:simulateTax(totals.income,totals.cost+extras.cost),
    high:simulateTax(totals.income+extras.income,totals.cost),
    partial:unresolved(c).some(item=>item.amountPLN==null)};
}
const range = (low,high) => low===high?cash(low):cash(low)+" – "+cash(high);
function taxEstimate(result) {
  if(result.partial && !result.income && !result.cost && !result.high) return "Do ustalenia";
  return range(result.low,result.high);
}
const cardExchangeRef = item => item.reference?.startsWith("CARD-")?
  "CB-CONV-"+item.reference.slice(5):"WYMIANA-"+(item.reference||item.id);
function proposal(c) {
  const result=calculation(c);
  const open=unresolved(c);
  const minutes=20+Math.max(0,c.selected.length-1)*10+open.reduce((total,item)=>{
    const proof=item.issue==="prior" ? c.prior?.file : getWork(c,item.id).intake?.file;
    return total+(proof?12:22);
  },0);
  const high=result.high;
  const plans=[
    {id:"standard",name:"Rozliczenie standardowe",minutes:45,limit:2500,price:349},
    {id:"extended",name:"Rozliczenie rozszerzone",minutes:90,limit:10000,price:549}
  ];
  const recommended=plans.find(plan=>plan.minutes>=minutes && plan.limit>=high && (!result.partial||plan.id!=="standard"));
  if(!recommended) {
    const extra={
      id:"individual",name:"Rozliczenie z dodatkową kontrolą",
      minutes:Math.max(120,Math.ceil(minutes/30)*30),
      limit:Math.max(15000,Math.ceil(high/5000)*5000)
    };
    extra.price=549+(extra.minutes-90)*4+Math.max(0,extra.limit-10000)/50;
    plans.push(extra);
  }
  return {plans,recommended:recommended??plans.at(-1),minutes,result,open};
}
function assessmentLine(c) {
  const count = group => c.selected.filter(id=>source(id).group===group).length;
  const pieces=[];
  if(count("exchange")) pieces.push(count("exchange")===1?"1 giełda":count("exchange")+" giełdy");
  if(count("wallet")) pieces.push(count("wallet")===1?"1 sieć portfela":count("wallet")+" sieci portfeli");
  if(count("other")) pieces.push(count("other")===1?"1 źródło dodatkowe":count("other")+" źródła dodatkowe");
  const reason=count("wallet")&&count("exchange")
    ? "Porównamy zapisy giełd i portfeli, żeby rozpoznać transfery między Twoimi źródłami."
    : count("other") ? "Operacje dodane ręcznie sprawdzimy wraz z ich potwierdzeniami."
    : count("exchange")>1 ? "Uporządkujemy historię giełd według zakupów, sprzedaży i transferów."
    : "Ocenimy zakres i kwoty po dodaniu historii.";
  return {summary:pieces.join(" · "),reason};
}
function fees(c) {
  return c.charges.filter(charge=>charge.year===c.year).reduce((sum,charge)=>sum+charge.amount,0);
}
function addEvent(c,title,detail="") {

}
function queueStatus(c) {
  if(c.approved) return {label:"Zatwierdzona",color:"green",key:"done"};
  if(!unresolved(c).length) return {label:"Do zatwierdzenia",color:"purple",key:"ready"};
  if(!readyToWork(c).length) return {label:"Czeka na klienta",color:"amber",key:"waiting"};
  return {label:"Do sprawdzenia",color:"purple",key:"ready"};
}
function taskPill(c,id) {
  if(getWork(c,id).decision) return pill("Rozstrzygnięte","green");
  if(waiting(c,id)) return pill("Czeka na klienta","amber");
  if(lastQuestion(c,id)?.reply) return pill("Klient odpowiedział","purple");
  return pill("Do sprawdzenia","purple");

const hashShort = hash => hash ? hash.slice(0,11)+"…"+hash.slice(-7) : "";
function valueOf(item) {
  if(item.network) return safe(item.quantity)+" "+safe(item.asset);
  return item.amountPLN!=null ? cash(item.amountPLN) : "Do ustalenia";
}
function operationFacts(item) {
  const items=[
    ["Źródło",safe(subject(item))],
    ...(item.date?[["Data",dateLabel(item.date)+(item.time?" · "+safe(item.time)+" UTC":"")]]:[]),
    [item.network?"Ilość":"Kwota",valueOf(item)]
  ];
  if(item.network) items.push(
    ["Sieć",source(item.network).name],["Adres nadawcy",`<span class="kt-hash">${safe(item.from)}</span>`],
    ["Adres odbiorcy",`<span class="kt-hash">${safe(item.to)}</span>`],["Hash transakcji",`<span class="kt-hash">${safe(item.hash)}</span>`]);
  if(item.reference) items.push(["Numer operacji w źródle",safe(item.reference)]);
  return fields(items);
}
function operationHeader(item,extended=false) {
  return `<div class="kt-title"><div><h2>${safe(item.kind)}</h2>
    <p>${safe(subject(item))}${item.date?" · "+dateLabel(item.date):""} · ${safe(item.reference||item.id)}</p>
    ${item.description?`<p>${safe(item.description)}</p>`:""}</div><strong class="kt-asset">${valueOf(item)}</strong></div>
    ${extended?operationFacts(item):item.network?`<details class="kt-disclosure" open><summary>Dane transferu</summary>${operationFacts(item)}</details>`:""}`;
}
function setupPage(c) {
  return report("Źródła historii",`<form data-form="setup">
    <label class="kt-field"><span>Rok rozliczenia</span><select name="year">${YEARS.map(year=>
      `<option value="${year}" ${year===c.year?"selected":""}>${year}</option>`).join("")}</select></label>
    ${GROUPS.map(group=>`<div class="kt-group"><fieldset>
      <legend>${group.name}</legend><p class="kt-muted">${group.description}</p>
      <div class="kt-options">${SOURCES.filter(item=>item.group===group.id).map(item=>
        `<label class="kt-check"><input type="checkbox" name="source" value="${item.id}" ${c.selected.includes(item.id)?"checked":""}>
        <span>${item.name}</span></label>`).join("")}</div>
      </fieldset></div>`).join("")}
    <div class="kt-group"><fieldset><legend>Czy w poprzednich latach rozliczałeś kryptowaluty w PIT-38?</legend>
      <div class="kt-options">${[["yes","Tak"],["no","Nie"],["unknown","Nie pamiętam"]].map(([key,label])=>
        `<label class="kt-check"><input type="radio" name="prior" value="${key}" ${c.priorAnswer===key?"checked":""} required><span>${label}</span></label>`).join("")}</div>
    </fieldset></div>${error}<div class="kt-actions">${submit("Przejdź do dodawania historii →")}</div></form>`);
}
function sourceState(c,item) {
  const info=c.imports[item.id];
  if(!info) return pill("Do uzupełnienia","amber");
  if(info.rows.length) return pill("Dodano · "+info.rows.length,"green");
  return info.noOps?pill("Potwierdzono 0 operacji","green"):pill("Sprawdź pusty import","amber");
}
function sourceLabel(item) {
  return item.group==="wallet"?"Portfel · "+item.name:item.name;
}
function sourcesList(c) {
  return c.selected.map(id=>{
    const item=source(id);
    const info=c.imports[id];
    return `<div class="source ${activeSource===id?"active":""}">
      <span class="sourceIcon" aria-hidden="true">${item.icon}</span>
      <div class="source-copy"><b>${sourceLabel(item)}</b>
        <div class="src-state">${sourceState(c,item)}${info?`<small>${methods[info.method]}</small>`:""}</div>
      </div>${button(info?"Szczegóły":"Dodaj historię","source-"+id,info?"secondary small":"primary small")}</div>`;
  }).join("");
}
function exchangeImport(c,item) {

let importEdit=false;
function sourceDetail(c,item) {
  const data=c.imports[item.id];
  if(!data || importEdit) {
    const body=item.group==="exchange"?exchangeImport(c,item):item.group==="wallet"?walletImport(c,item):manualImport(c,item);
    return report(sourceLabel(item),body);
  }
  const details=fields([
    ["Metoda",methods[data.method]],["Operacje",String(data.rows.length)],
    ...(data.period?[["Zakres importu",data.period]]:[]),
    ...(data.address?[["Adres",`<span class="kt-hash">${safe(data.address)}</span>`]]:[]),
    ...(data.file?[["Plik",safe(data.file)]]:[]),
    ...(data.method==="aggregator"?[["Opłata za import",cash(IMPORT_PRICE)]]:[])
  ]);
  return report(sourceLabel(item),details+
    (data.rows.length?`<div class="kt-actions">${button("Pokaż operacje z tego źródła","ledger-"+item.id,"secondary")}
      ${item.group==="other"?button("Dodaj kolejną operację","add-manual","secondary"):""}</div>`
      :note(info.noOps?"Potwierdzono, że w tym zakresie brak operacji.":"Import nie zwrócił operacji dla podanego adresu.")+
        `<div class="kt-actions">${info.noOps?"":button("Potwierdź brak operacji","confirm-empty","secondary")}
          ${button("Zmień dane portfela","retry-source","secondary")}</div>`));
}

    <div class="kt-hero"><h2>${assessment.summary}</h2><p>${assessment.reason}</p></div>
    <div class="kt-source-layout">
      ${report("Źródła danych",`<p class="kt-muted">Uzupełniono ${count} z ${c.selected.length}</p>`+sourcesList(c))}
      ${selected?sourceDetail(c,selected):report("Dodawanie historii","<p>Otwórz wybrane źródło. Dostępne metody i ich ceny zobaczysz przy tym źródle.</p>")}
    </div>
    ${canPrepare(c)?note("Dodano dane ze wszystkich wskazanych źródeł. Operacje w historii · "+ledger(c).length+".","good")

function intakeForm(c,item) {

    <form data-form="intake" data-id="${item.id}" style="margin-top:12px">
      <fieldset><legend>Twoja odpowiedź</legend><div class="kt-stack">

let editIntake="";
function checksPage(c) {
  const toExplain = (editIntake && findTask(c,editIntake)) || nextIntake(c);
  const linked=ledger(c).filter(item=>item.direction==="out" && pairedWith(c,item)).length;
  if(toExplain) return intakeForm(c,toExplain);
  if(c.priorAnswer!=="no" && !c.prior) return priorForm(c);
  const tasks=workItems(c);
  return report("Podsumowanie historii",fields([
    ["Dodane źródła",String(c.selected.length)],["Operacje",String(ledger(c).length)],
    ...(linked?[["Dopasowane transfery między źródłami",String(linked)]]:[]),
    ["Pozycje do decyzji księgowej",String(tasks.length)]
  ])+`<div class="kt-stack">${tasks.map(item=>`<div class="kt-line"><div><strong>${safe(item.kind)}</strong><br>
    <span class="kt-muted">${safe(spec(c,item).title)}</span></div>
    ${item.issue==="prior"?pill("Zapisano","green"):button("Zobacz odpowiedź","intake-"+item.id,"secondary small")}</div>`).join("")}</div>
    <div class="kt-actions">${button("Zobacz proponowany plan →","to-offer")}${button("Historia operacji","client-ledger","secondary")}</div>`);
}
function calculationFields(c) {

  return fields([
    ["Przychody ujęte w wyliczeniu",cash(data.income)],["Koszty ujęte w wyliczeniu",cash(data.cost)],
    [c.approved?"Zatwierdzony podatek":"Podatek z ujętych pozycji",cash(data.tax)],
    ...(data.low!==data.high?[["Szacunek po otwartych decyzjach",range(data.low,data.high)]]:[]),
    ...(data.partial?[["Dane do ustalenia","Otwarta pozycja bez potwierdzonej wartości"]]:[])

}

    ${report("Jak wyliczyliśmy zakres obsługi",fields([

      ["Szacowany czas księgowej","około "+quote.minutes+" min"],
      ["Co wpływa na czas",c.selected.length+" źr. · "+quote.open.length+" pozycji do sprawdzenia"]
    ])+(quote.result.partial?note("Szacunek obejmuje operacje z ustaloną wartością. Księgowa sprawdzi pozycje bez potwierdzonej wartości.","warn"):""))}

      const fits=plan.minutes>=quote.minutes && plan.limit>=quote.result.high && (!quote.result.partial||plan.id!=="standard");
      const selected=plan.id===ready.id;
      return `<section class="card kt-pack ${selected?"selected":""}">${plan.id===quote.recommended.id?pill("Rekomendowany","green"):selected?pill("Wybrany"):""}
        <h3>${plan.name}</h3><div class="kt-price mono">${cash(plan.price)}</div>
        <ul class="kt-clean"><li>Do ${plan.minutes} min pracy księgowej</li><li>Limit ochrony ${cash(plan.limit)}</li>
          <li>Weryfikacja tożsamości i przygotowanie PIT-38 przez biuro</li></ul>
        ${fits?button(selected?"Wybrano":"Wybierz plan","plan-"+plan.id,selected?"secondary":"primary",selected)
          :pill("Zakres poniżej szacunku","amber")}</section>`;
    }).join("")}</div>
    ${fees(c)?note("Opłacone importy przez agregator · "+cash(fees(c))+". Opłata za rozliczenie jest wykazana osobno."):""}
    ${report("Płatność za rozliczenie","<p>Po opłaceniu zobaczysz wyliczenie robocze i przejdziesz do weryfikacji tożsamości.</p>"+
      `<div class="kt-actions">${button("Opłać plan · "+cash(ready.price),"buy")}${button("Wróć do historii","back-imports","secondary")}</div>`)}</div>`;
}

    `<form data-form="reply" data-id="${item.id}" style="margin-top:12px">

function submittedPage(c) {
  if(c.approved) return `<div class="kt-stack">

    ${report("Przekazane materiały",fields([["Data przekazania",dateLabel(c.sent)],["Źródła",c.selected.map(id=>sourceLabel(source(id))).join(", ")],
      ["Operacje",String(ledger(c).length)]])+`<div class="kt-actions">${button("Historia operacji","client-ledger","secondary")}${button("Historia sprawy","client-events","secondary")}</div>`)}</div>`;

function clientContent(c) {
  if(clientView==="ledger") return `<div class="kt-actions" style="margin-bottom:12px">${button("← Wróć do rozliczenia","client-home","secondary")}</div>`+ledgerView(c);
  if(clientView==="events") return `<div class="kt-actions" style="margin-bottom:12px">${button("← Wróć do rozliczenia","client-home","secondary")}</div>`+eventView(c);
  if(clientView==="documents") return `<div class="kt-actions" style="margin-bottom:12px">${button("← Wróć do rozliczenia","client-home","secondary")}</div>`+documentView(c);
  const index=stepIndex(c);
  const screens={
    setup:["Wskaż źródła i rok rozliczenia","Bezpłatne rozpoznanie sprawy.",setupPage],
    imports:["Dodaj historię z wybranych źródeł","Każde źródło możesz uzupełnić osobno.",importsPage],
    checks:["Sprawdź zebrane dane","Jeśli brakuje informacji, zobaczysz pytanie przy konkretnej pozycji.",checksPage],
    offer:["Wybierz zakres rozliczenia","Plan uwzględnia szacowany podatek i przewidywany czas pracy księgowej.",offerPage],
    identity:["Wyliczenie i weryfikacja","Po sprawdzeniu tożsamości przekaż dane do biura.",identityPage],
    submitted:["Twoje rozliczenie","",submittedPage]
  };
  const [title,description,page]=screens[c.stage];
  return `<section class="wizard-intro"><div class="wizard-meta">
    <span class="eyebrow">PIT-38 · ${caseRef(c)}</span><span class="wizard-count">Krok <strong>${index+1}</strong> z ${STEPS.length}</span></div>
    <div class="wizard-track" role="progressbar" aria-label="Etap rozliczenia" aria-valuemin="1" aria-valuemax="${STEPS.length}" aria-valuenow="${index+1}">
      ${STEPS.map((_,i)=>`<span class="${i<=index?"filled":""}"></span>`).join("")}</div>
    <div class="wizard-heading"><div><h1 tabindex="-1">${title}</h1>${description?`<p>${description}</p>`:""}</div>
      <span class="year-tag">PIT-38 <strong>${c.year}</strong></span></div></section><div class="wizard-body">${page(c)}</div>`;
}

let tx = {query:"",source:"all",status:"all",view:"groups"};
const resetTx = (sourceName="all") => {tx={query:"",source:sourceName,status:"all",view:sourceName==="all"?"groups":"list"};};
function ledgerStatus(c,item) {
  if(item.network && pairedWith(c,item)) return ["Transfer dopasowany","green"];
  const task=findTask(c,item.id);
  const decision=task ? getWork(c,item.id).decision : null;
  if(task && !decision) return ["Do wyjaśnienia","amber"];
  const kind=decision?.code??item.effect;
  return kind==="income"?["Przychód","green"]:kind==="cost"?["Koszt","green"]:["Poza wyliczeniem","purple"];
}
function filteredRows(c) {
  const query=tx.query.trim().toLocaleLowerCase("pl");
  return ledger(c).filter(row=>
    (tx.source==="all"||subject(row)===tx.source) && (tx.status==="all"||ledgerStatus(c,row)[0]===tx.status)
    && (!query||[row.id,row.date,row.kind,subject(row),row.description,row.hash,valueOf(row)].join(" ").toLocaleLowerCase("pl").includes(query))
  );
}
function ledgerResults(c) {
  const rows=filteredRows(c);
  const count=ledger(c).length;
  const summary=`<div class="tx-results-head"><span><strong>${rows.length}</strong> z ${count} operacji</span>
    ${button("Wyczyść filtry","tx-clear","secondary small")}</div>`;
  if(!rows.length) return summary+`<div class="empty-state compact"><h3>${count?"Brak pasujących operacji":"Historia jest pusta"}</h3></div>`;
  const groups = new Map();
  for(const item of rows) {
    const key=subject(item)+"|"+item.kind;
    if(!groups.has(key)) groups.set(key,{source:subject(item),kind:item.kind,rows:[]});
    groups.get(key).rows.push(item);
  }
  const grouped = `<div class="table-scroll"><table class="tx-table"><thead><tr><th>Źródło i rodzaj</th>
    <th>Operacje</th><th>Zakres dat</th><th></th></tr></thead><tbody>${[...groups.values()].map(group=>
      `<tr><td><strong>${safe(group.source)}</strong><small>${safe(group.kind)}</small></td>
        <td><span class="group-count">${group.rows.length}</span></td>
        <td>${dateLabel(group.rows[0].date)} – ${dateLabel(group.rows.at(-1).date)}</td>
        <td><button type="button" class="btn secondary small" data-group-source="${safe(group.source)}" data-group-kind="${safe(group.kind)}">Zobacz operacje</button></td></tr>`).join("")}
    </tbody></table></div>`;
  const list=`<div class="table-scroll"><table class="tx-table"><thead><tr><th>Data</th><th>Źródło</th><th>Operacja</th>
    <th class="right">Kwota lub ilość</th><th>Ujęcie w sprawie</th></tr></thead><tbody>${rows.map(item=>{

const num = value => {
  const result=Number(value);
  return Number.isFinite(result) && result>=.01 && result<=1000000 ? rounded(result) : null;
};
const readFile = data => data.get("file")?.name??"";
function storedProof(form,data,fallback={}) {
  const file=readFile(data);
  return file?{file,sample:form.dataset.sampleFile===file}:{file:fallback.file||"",sample:Boolean(fallback.sample)};
}
function importComplete(c,id,data) {

function clientForm(c,form,data,submitter) {
  const kind=form.dataset.form;
  const id=form.dataset.id;
  switch(kind) {
    case "setup": {
      if(c.paid) return;
      const selected=SOURCES.filter(item=>data.getAll("source").includes(item.id)).map(item=>item.id);
      const year=Number(data.get("year"));
      const prior=data.get("prior");
      if(!selected.length || !YEARS.includes(year) || !["yes","no","unknown"].includes(prior)) {
        return setFormError(form,"Wybierz źródło, rok i odpowiedź o wcześniejszym PIT-38.");
      }
      if(c.year!==year) {
        c.year=year;
        c.imports={};
        c.work={};
        c.prior=null;
        c.events=[];
      }
      if(c.priorAnswer!==prior) {
        c.prior=null;
        delete c.work["PIT-"+(c.year-1)];
      }
      c.priorAnswer=prior;
      c.selected=selected;
      c.plan=null;
      activeSource="";
      importEdit=false;
      gotoClient("imports",c);
      return;
    }
    case "exchange-file": {
      if(c.paid || !c.selected.includes(id) || source(id).group!=="exchange") return;
      const file=readFile(data);
      if(!file.toLowerCase().endsWith(".csv")) return setFormError(form,"Wybierz plik CSV.");
      importComplete(c,id,imported(c,id,"csv",file));
      break;
    }
    case "wallet-file": {
      if(c.paid || !c.selected.includes(id) || !NETWORKS[id]) return;
      const address=String(data.get("address")||"").trim();
      if(!NETWORKS[id].pattern.test(address)) return setFormError(form,"Podaj publiczny adres w sieci "+source(id).name+".");
      if(submitter?.value==="aggregator") {
        if(!c.charges.some(charge=>charge.year===c.year&&charge.id===id&&equalAddress(id,charge.address,address))) {
          confirmModal("Płatny import portfela",`Za historię adresu w sieci ${source(id).name} zapłacisz <strong>${cash(IMPORT_PRICE)}</strong>.
            Opłata dotyczy uruchomienia agregatora.`, "Zapłać i uruchom import",{type:"aggregator",caseId:c.id,id,address});
          return;
        }
        importComplete(c,id,imported(c,id,"aggregator","",address));
        break;
      }
      const file=readFile(data);
      if(!file.toLowerCase().endsWith(".csv")) return setFormError(form,"Wybierz plik CSV z historią tego portfela.");
      importComplete(c,id,imported(c,id,"csv",file,address));
      break;
    }
    case "manual": {
      if(c.paid || !c.selected.includes(id) || source(id).group!=="other") return;
      const amount=num(data.get("amount"));
      const date=String(data.get("date")||"");
      const place=String(data.get("place")||"").trim();
      if(!amount || !date.startsWith(c.year+"-") || Number.isNaN(Date.parse(date)) || !place) {
        return setFormError(form,"Podaj datę w rozliczanym roku, kwotę i źródło operacji.");
      }
      const rows=c.imports[id]?.rows??[];
      const row=op(id,(id==="cash"?"KANTOR-":"KARTA-")+(rows.length+1),date,
        id==="cash"?"Wypłata w kantorze lub bitomacie":"Płatność kartą krypto",place,amount,"outside");
      row.issue=id;
      row.reference=String(data.get("ref")||"").trim();
      row.proof=storedProof(form,data);
      importComplete(c,id,{method:"manual",rows:[...rows,row]});
      break;
    }
    case "intake": {
      if(c.paid) return;
      const item=findTask(c,id);
      const choice=data.get("choice");
      if(!item || !spec(c,item).options?.some(([key])=>key===choice)) return setFormError(form,"Wybierz odpowiedź.");
      const work=ensureWork(c,id);
      work.intake={choice,note:String(data.get("note")||"").trim(),
        ...storedProof(form,data,work.intake||item.proof)};
      c.plan=null;
      editIntake="";
      addEvent(c,"Zapisano odpowiedź",item.reference||item.id);
      break;
    }
    case "prior": {
      if(c.paid || c.priorAnswer==="no") return;
      const choice=data.get("choice");
      const amount=num(data.get("amount"));
      const proof=storedProof(form,data);
      if(!["cost","none","unsure"].includes(choice)) return setFormError(form,"Wybierz odpowiedź.");
      if(choice==="cost" && amount==null && !proof.file) return setFormError(form,"Podaj kwotę lub dołącz deklarację. Możesz też wybrać „Nie mogę teraz ustalić”.");
      c.prior={choice,amount:choice==="none"?null:amount,...proof};
      const work=ensureWork(c,"PIT-"+(c.year-1));
      work.intake={...proof,note:choice==="unsure"?"Klient nie mógł ustalić kosztów.":"Klient zgłosił wcześniejsze rozliczenie do sprawdzenia."};
      c.plan=null;
      addEvent(c,"Zapisano dane o wcześniejszym PIT-38");
      break;
    }
    case "reply": {
      if(!c.sent || !findTask(c,id) || !waiting(c,id)) return;
      const text=String(data.get("note")||"").trim();
      const proof=storedProof(form,data);
      if(!text && !proof.file) return setFormError(form,"Dodaj odpowiedź lub dokument.");
      lastQuestion(c,id).reply={date:today(),text,...proof};
      addEvent(c,"Klient przekazał uzupełnienie",id);
      break;
    }
    default:return;
  }
  save("Dane zapisane.");
}
function dialogConfirm(context) {
  if(!context) return;
  if(context.type==="reset") {
    closeModal();
    cases=initialCases();
    role="client";clientId="marta";advisorId="";clientView="journey";advisorView="queue";
    activeSource="";activeTask="";importEdit=false;editIntake="";resetTx();filter="all";queueText="";
    save("Przywrócono dane makiety.");
    return;
  }
  const c=byId(context.caseId);
  if(!c) return;
  switch(context.type) {
    case "connect":
      if(c.paid || !c.selected.includes(context.id)) return;
      importComplete(c,context.id,imported(c,context.id,"api"));
      break;
    case "aggregator":
      if(c.paid || !c.selected.includes(context.id)) return;
      if(!c.charges.some(charge=>charge.year===c.year&&charge.id===context.id&&equalAddress(context.id,charge.address,context.address))) {
        c.charges.push({year:c.year,id:context.id,address:context.address,amount:IMPORT_PRICE});
      }
      importComplete(c,context.id,imported(c,context.id,"aggregator","",context.address));
      break;
    case "buy": {
      if(c.paid || !canQuote(c)) return;
      const quote=proposal(c);
      const plan=c.plan||quote.recommended;
      if(!planFits(c,plan)) return;
      c.plan={...plan,estimate:quote.minutes};
      c.paid={date:today(),ref:"KT-P-"+c.number};
      c.stage="identity";
      addEvent(c,"Opłacono rozliczenie",plan.name+" · "+cash(plan.price));
      break;
    }
    case "verify":
      if(!c.paid || c.verified) return;
      c.verified=true;
      addEvent(c,"Tożsamość zweryfikowana","Zakończono weryfikację tożsamości i AML.");
      break;
    default:return;
  }
  closeModal();
  save("Zapisano.");
}
function handleClient(action,c) {
  if(action==="client-home") {clientView="journey";render(true);return;}
  if(action==="client-ledger" || action.startsWith("ledger-")) {
    const id=action.startsWith("ledger-")?action.slice(7):"";
    clientView="ledger";resetTx(source(id)?.name);render(true);return;
  }
  if(action==="client-docs" || action==="client-events") {
    clientView=action==="client-docs"?"documents":"events";render(true);return;
  }
  if(action.startsWith("step-")) {
    const stage=action.slice(5);
    if(stage===c.stage) {clientView="journey";render(true);return;}
    if(!c.paid && (stage==="setup" || stage==="imports"&&c.selected.length || stage==="checks"&&canPrepare(c))) {
      gotoClient(stage,c);
    }
    return;
  }
  if(action.startsWith("source-") && c.selected.includes(action.slice(7))) {
    activeSource=action.slice(7);importEdit=false;render(true);return;
  }
  if(action.startsWith("connect-")) {
    const id=action.slice(8);
    if(c.paid || !c.selected.includes(id) || source(id).group!=="exchange") return;
    confirmModal("Połącz "+source(id).name,`Pobierzemy historię za ${c.year} rok z dostępem do odczytu. Połączenie jest bezpłatne.`,
      "Połącz i pobierz historię",{type:"connect",caseId:c.id,id});
    return;
  }
  if(action.startsWith("intake-") && !c.paid) {
    editIntake=action.slice(7);render(true);return;
  }
  if(action.startsWith("plan-") && !c.paid && c.stage==="offer") {
    const plan=proposal(c).plans.find(item=>item.id===action.slice(5));
    if(planFits(c,plan)) {c.plan=plan;save();}
    return;
  }
  switch(action) {
    case "edit-setup": if(!c.paid) gotoClient("setup",c);return;
    case "back-imports": if(!c.paid) gotoClient("imports",c);return;
    case "add-manual": case "retry-source": if(!c.paid) {importEdit=true;render(true);}return;
    case "confirm-empty": {
      const data=c.imports[activeSource];
      if(!c.paid && data && !data.rows.length) {data.noOps=true;save("Potwierdzono brak operacji.");}
      return;
    }
    case "to-checks": if(canPrepare(c)) gotoClient("checks",c);return;
    case "to-offer": if(canQuote(c)) gotoClient("offer",c);return;
    case "buy": {
      if(c.paid || !canQuote(c)) return;
      const plan=c.plan||proposal(c).recommended;
      if(planFits(c,plan)) confirmModal("Płatność za rozliczenie",`${safe(plan.name)} · <strong>${cash(plan.price)}</strong>.
        Po opłaceniu zobaczysz wyliczenie i przejdziesz do weryfikacji tożsamości.`,"Potwierdź płatność",{type:"buy",caseId:c.id});
      return;
    }
    case "verify":
      if(c.paid && !c.verified) confirmModal("Weryfikacja tożsamości i AML",
        "Operator zweryfikuje tożsamość w ramach opłaconej usługi.","Rozpocznij weryfikację",{type:"verify",caseId:c.id});
      return;
    case "send":
      if(c.paid && c.verified && canQuote(c) && !c.sent) {
        c.sent=today();
        addEvent(c,"Dane przekazane do biura",ledger(c).length+" operacji · "+c.selected.length+" źr.");
        gotoClient("submitted",c);
      }
      return;
  }
}
function handleAdvisor(action,c) {
  if(action==="aqueue" || action==="atasks") {
    advisorView=action==="aqueue"?"queue":"tasks";
    advisorId="";
    render(true);
    return;
  }
  if(action.startsWith("case-task:")) {
    const [,id,task]=action.split(":");
    gotoCase(id,task);return;
  }
  if(action.startsWith("case-")) {gotoCase(action.slice(5));return;}
  if(!c) return;
  if(action.startsWith("atab-")) {
    advisorTab=action.slice(5);resetTx();render(true);return;
  }
  if(action.startsWith("task-")) {activeTask=action.slice(5);render(true);return;}
  if(action==="approve" && canApprove(c) && !c.approved) {approvalModal(c);return;}
  if(action.startsWith("ask-") || action.startsWith("decide-")) {
    const request=action.startsWith("ask-");
    const task=findTask(c,action.slice(request?4:7));
    if(!task || waiting(c,task.id) || getWork(c,task.id).decision || c.approved) return;
    if(request) requestModal(c,task);
    else decisionModal(c,task);
  }
}

window.addEventListener("storage",event=>{

  try {
    const stored=JSON.parse(event.newValue);
    if(Array.isArray(stored) && stored.length===cases.length) {cases=stored;render();}
  } catch {}
});
render();

</script>
